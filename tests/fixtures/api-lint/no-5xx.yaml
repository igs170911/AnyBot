openapi: 3.1.0
info:
  title: AnyBot 伺服器 API
  description: 自檢基準檔：完全合規的文件，五個變體各缺一樣。
  contact:
    name: AnyBot 開發團隊
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8787
    description: 本機開發伺服器
security:
  - bearer: []
tags:
  - name: system
    description: 伺服器本身
paths:
  /v1/health:
    get:
      tags: [system]
      summary: 伺服器健康檢查
      description: 回傳伺服器版本、現在時間和事件協定版本。
      operationId: get_health
      security:
        - {}
      responses:
        "200":
          description: 伺服器活著
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                now: 2026-01-01T00:00:00Z
                protocol_version: 1
                version: 0.1.0
        "400":
          description: 請求格式錯誤
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
              example:
                type: https://anybot.test/problems/bad-request
                title: 請求格式錯誤
                status: 400
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    HealthResponse:
      type: object
      title: 健康檢查回應
      required: [version, now, protocol_version]
      properties:
        version:
          type: string
          examples: ["0.1.0"]
        now:
          type: string
          examples: ["2026-01-01T00:00:00Z"]
        protocol_version:
          type: integer
          examples: [1]
    ProblemJson:
      type: object
      title: RFC 7807 問題詳情
      required: [type, title, status]
      properties:
        type:
          type: string
          examples: ["https://anybot.test/problems/bad-request"]
        title:
          type: string
          examples: ["請求格式錯誤"]
        status:
          type: integer
          examples: [400]
        detail:
          type: string
          examples: ["明細說明"]
