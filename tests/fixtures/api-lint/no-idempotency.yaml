openapi: 3.1.0
info:
  title: AnyBot server API
  description: "self-test baseline: a fully compliant document; each of the five variants lacks one thing."
  contact:
    name: AnyBot dev team
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8787
    description: local dev server
security:
  - bearer: []
tags:
  - name: system
    description: the server itself
paths:
  /v1/health:
    get:
      tags: [system]
      summary: server health check
      description: returns the server version, the current time, and the event protocol version.
      operationId: get_health
      security:
        - {}
      responses:
        "200":
          description: the server is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                now: 2026-01-01T00:00:00Z
                protocol_version: 1
                version: 0.1.0
        "400":
          description: the request was malformed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
              example:
                type: https://anybot.test/problems/bad-request
                title: the request was malformed
                status: 400
        "500":
          description: the server hit an internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
              example:
                type: https://anybot.test/problems/internal
                title: the server hit an internal error
                status: 500
  /v1/runs:
    post:
      tags: [system]
      summary: submit a run
      description: submit a round of run events.
      operationId: post_runs
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: run event
              properties:
                kind:
                  type: string
                  examples: ["turn_started"]
            example:
              kind: turn_started
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                type: object
                title: acceptance result
                properties:
                  accepted:
                    type: boolean
                    examples: [true]
              example:
                accepted: true
        "400":
          description: the request was malformed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
              example:
                type: https://anybot.test/problems/bad-request
                title: the request was malformed
                status: 400
        "500":
          description: the server hit an internal error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
              example:
                type: https://anybot.test/problems/internal
                title: the server hit an internal error
                status: 500
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    HealthResponse:
      type: object
      title: health check response
      required: [version, now, protocol_version]
      properties:
        version:
          type: string
          examples: ["0.1.0"]
        now:
          type: string
          examples: ["2026-01-01T00:00:00Z"]
        protocol_version:
          type: integer
          examples: [1]
    ProblemJson:
      type: object
      title: RFC 7807 problem details
      required: [type, title, status]
      properties:
        type:
          type: string
          examples: ["https://anybot.test/problems/bad-request"]
        title:
          type: string
          examples: ["the request was malformed"]
        status:
          type: integer
          examples: [400]
        detail:
          type: string
          examples: ["detailed explanation"]
