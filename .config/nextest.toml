[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

[test-groups]
pg = { max-threads = 1 }
ports = { max-threads = 1 }
net = { max-threads = 1 }
prop = { max-threads = 1 }
scratch = { max-threads = 1 }
timing = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(/^pg_/)'
test-group = "pg"

[[profile.default.overrides]]
filter = 'test(/::pg_/)'
test-group = "pg"

[[profile.default.overrides]]
filter = 'test(/(install_n22_1|install_n22_3|health_endpoint_answers|second_server_exits|startup_line_reports|server_boot|server_n14_[134]|server_n8_3)/)'
test-group = "pg"

[[profile.default.overrides]]
filter = 'test(/(t_install_n22|t_server_n14_2|health_endpoint_answers|second_server_exits|bind_plan_says_port|startup_listens_on_the_addresses|startup_logs_announce)/)'
test-group = "ports"

[[profile.default.overrides]]
filter = 'test(netctl_)'
test-group = "net"

[[profile.default.overrides]]
filter = 'test(/(t_turn_loop_1|t_turn_loop_9|t_chat_stop_9|t_task_journal_4|turn_intent_record_precedes_computer_operation|t_report_delivery_11)/)'
test-group = "prop"
slow-timeout = { period = "300s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'test(t_account_login_4) or test(t_account_login_9) or test(t_safety_n10_2) or test(t_safety_n10_6)'
test-group = "timing"

[[profile.default.overrides]]
filter = "package(api-compat)"
test-group = "scratch"

[[profile.default.overrides]]
filter = 'test(t_conn_heartbeat_2)'
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'binary(/^pg_/) + test(t_install|t_server)'
slow-timeout = { period = "120s", terminate-after = 4 }

# Basic tests (make test-basic, Windows and macOS CI). A test that starts
# PostgreSQL lives in a file named pg_*.rs. That file is the nextest binary name.
# A test that compiles a fresh crate (trybuild, or cargo/rustc/clippy-driver)
# is named *_compile_fail. Those have no build cache on CI, so basic tests skip
# them. Linux make check still runs them. The name mark is the suffix so a test
# that only mentions the rule still runs here.
[profile.quick]
default-filter = 'not (binary(/^pg_/) | test(/_compile_fail$/))'
