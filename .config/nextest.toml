[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

[test-groups]
pg = { max-threads = 1 }
ports = { max-threads = 1 }
net = { max-threads = 1 }
timing = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/postgres_(dropped|install|migration|restart|stop|two)/)'
test-group = "pg"

[[profile.default.overrides]]
filter = 'test(/::pg_/)'
test-group = "pg"

[[profile.default.overrides]]
filter = 'test(/(install_n22_1|install_n22_3|health_endpoint_answers|second_server_exits|startup_line_reports|server_boot|server_n14_[134]|server_n8_3)/)'
test-group = "pg"

[[profile.default.overrides]]
filter = 'test(/(t_install_n22|t_server_n14_2|health_endpoint_answers|second_server_exits|bind_plan_says_port|startup_listens_on_the_addresses|startup_logs_announce)/)'
test-group = "ports"

[[profile.default.overrides]]
filter = 'test(netctl_)'
test-group = "net"

[[profile.default.overrides]]
filter = 'test(t_account_login_4) or test(t_account_login_9) or test(t_safety_n10_2) or test(t_safety_n10_6)'
test-group = "timing"

[[profile.default.overrides]]
filter = 'test(t_install|t_server|postgres)'
slow-timeout = { period = "120s", terminate-after = 4 }

[profile.quick]
default-filter = 'not test(/(postgres_(dropped|install|migration|restart|stop|two)|::pg_|(t_server|t_account|t_safety|t_conn|t_install|pg_|cli_reset|run_against|run_after|startup_logs|health_endpoint|second_server|sequential_registration|concurrent_registration|config_defaults|idempotency_records|hourly_cleanup))/)'
