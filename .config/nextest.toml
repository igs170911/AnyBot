[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }

[test-groups]
pg = { max-threads = 1 }
ports = { max-threads = 1 }
net = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/postgres_(dropped|install|migration|stop|two)/)'
test-group = "pg"

[[profile.default.overrides]]
filter = 'test(/(t_install_n22|t_server_n14_2|health_endpoint_answers|second_server_exits|bind_plan_says_port)/)'
test-group = "ports"

[[profile.default.overrides]]
filter = 'test(netctl_)'
test-group = "net"

[[profile.default.overrides]]
filter = 'test(t_install|t_server|postgres)'
slow-timeout = { period = "90s", terminate-after = 4 }

[profile.quick]
default-filter = 'not test(/postgres_(dropped|install|migration|stop|two)/)'
