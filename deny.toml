# cargo-deny (spec/06 section 2.7)
[graph]
all-features = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
confidence-threshold = 0.8
exceptions = []
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
version = 2
# Tauri 2 (apps/desktop, Linux side) pulls in proc-macro-error via glib-macros:
# the maintainer-missing advisory has no available upgrade (the tauri side has not swapped it out yet),
# it is a read-only proc-macro helper touching no network and no keys; allow it with this recorded reason.
# (M2: the desktop shell is Tauri 2, spec/06 section 2.4)
yanked = "deny"
ignore = ["RUSTSEC-2024-0370"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
allow = []
skip = []

[[bans.deny]]
name = "openssl"
reason = "TLS always uses rustls (spec/06)"

[[bans.deny]]
name = "openssl-sys"
reason = "TLS always uses rustls (spec/06)"

[[bans.deny]]
name = "openssl-macros"
reason = "TLS always uses rustls (spec/06)"

[[bans.deny]]
name = "native-tls"
reason = "TLS always uses rustls (spec/06)"

[[bans.deny]]
name = "noyalib"
reason = "0.0.x, 64 releases in half a year, single author; the author previous YAML crate is flagged unsafe by RustSec (spec/06 section 2.7; M3 review item 14)"

[[bans.deny]]
name = "serde_yml"
reason = "flagged unsafe by RustSec; the unmaintained noyalib predecessor by the same author (M3 review item 14)"

[[bans.deny]]
name = "serde_yaml"
reason = "serde_yaml is unmaintained; the official successor is yaml_serde (M3 review item 14)"
