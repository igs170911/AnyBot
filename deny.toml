# cargo-deny（spec/06 §2.7）
[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
version = 2

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[[bans.deny]]
name = "openssl"
reason = "TLS 一律用 rustls（spec/06）"

[[bans.deny]]
name = "openssl-sys"
reason = "TLS 一律用 rustls（spec/06）"

[[bans.deny]]
name = "openssl-macros"
reason = "TLS 一律用 rustls（spec/06）"

[[bans.deny]]
name = "native-tls"
reason = "TLS 一律用 rustls（spec/06）"
