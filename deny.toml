# cargo-deny（spec/06 §2.7）
[graph]
all-features = true

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
version = 2
# Tauri 2（apps/desktop，Linux 側）經 glib-macros 拉到 proc-macro-error：
# 那顆套件「維護者失蹤」的 advisory 沒有可用的升級（tauri 那一側還沒換掉），
# 它是唯讀的 proc-macro 輔助、不碰網路和金鑰，先記錄原因後放過。
# （M2：桌面殼是 Tauri 2，`spec/06` §2.4）
ignore = ["RUSTSEC-2024-0370"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[[bans.deny]]
name = "openssl"
reason = "TLS 一律用 rustls（spec/06）"

[[bans.deny]]
name = "openssl-sys"
reason = "TLS 一律用 rustls（spec/06）"

[[bans.deny]]
name = "openssl-macros"
reason = "TLS 一律用 rustls（spec/06）"

[[bans.deny]]
name = "native-tls"
reason = "TLS 一律用 rustls（spec/06）"
