# Release skeleton (spec/09 K110, K111). No signing, no custom secrets: GITHUB_TOKEN only.
# Publish paths are a v* tag push (stable) and a workflow_call with mode=dev
# (the CI workflow calls that only after Linux, Windows, and macOS are green).
# A ws/rel-* push and a manual run are rehearsal: they build and upload artifacts,
# and they do not create a Release, push an image, or move a tag.
# A release: released event runs only the `latest` job.
name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "ws/rel-**"
  release:
    types:
      - released
  workflow_dispatch:
  workflow_call:
    inputs:
      mode:
        description: dev publishes the dev channel; anything else rehearses
        required: true
        type: string
      commit:
        description: commit the caller already checked
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  # Owner and name come from the repository, lowercased. Not a hardcoded account.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  guard:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      channel: ${{ steps.mode.outputs.channel }}
      version: ${{ steps.mode.outputs.version }}
      tag: ${{ steps.mode.outputs.tag }}
      commit: ${{ steps.mode.outputs.commit }}
      built_at: ${{ steps.mode.outputs.built_at }}
      describe: ${{ steps.mode.outputs.describe }}
      image: ${{ steps.mode.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: decide mode and refuse a bad tag
        id: mode
        env:
          CALL_MODE: ${{ inputs.mode || '' }}
          CALL_COMMIT: ${{ inputs.commit || '' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: sh deploy/release/guard.sh

  desktop:
    needs: guard
    if: github.event_name != 'release' && needs.guard.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.runner }} # pinned in the matrix: macos-15, macos-15-intel, windows-2025, ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: linux bundling packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libxdo-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf rpm file-roller

      - name: rust target
        run: rustup target add ${{ matrix.target }}

      - name: pnpm
        shell: bash
        run: npm install -g pnpm@12.23.0

      - name: install the web workspace
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: export compile-time release values
        shell: bash
        env:
          ANYBOT_RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: sh deploy/release/export-build-env.sh

      - name: write the channel overlay
        shell: bash
        env:
          ANYBOT_RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: sh deploy/release/tauri-channel.sh target/tauri-channel.json

      - name: bundle the desktop shell
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ../../target/tauri-channel.json

      - name: collect installers
        shell: bash
        run: sh deploy/release/collect-bundles.sh "target/release-assets/${{ matrix.target }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: target/release-assets/${{ matrix.target }}
          retention-days: 14

  image:
    needs: guard
    if: github.event_name != 'release' && needs.guard.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: export compile-time release values
        env:
          ANYBOT_RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: sh deploy/release/export-build-env.sh

      - name: expected version line
        id: version
        env:
          ANYBOT_GIT_DESCRIBE: ${{ needs.guard.outputs.describe }}
          SOURCE_DATE_EPOCH: ${{ needs.guard.outputs.built_at }}
        run: |
          set -euo pipefail
          mkdir -p target
          line="$(sh deploy/release/version-line.sh)"
          printf '%s\n' "$line" > target/expected-version.txt
          echo "expected $line"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: build and load the amd64 image for --version
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            ANYBOT_RELEASE_CHANNEL=${{ needs.guard.outputs.channel }}
            ANYBOT_GIT_DESCRIBE=${{ needs.guard.outputs.describe }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.built_at }}
          tags: ${{ needs.guard.outputs.image }}:verify

      - name: run --version inside the amd64 image
        env:
          IMAGE: ${{ needs.guard.outputs.image }}
        run: |
          set -euo pipefail
          got="$(docker run --rm --entrypoint /usr/local/bin/anybot-server "${IMAGE}:verify" --version)"
          want="$(tr -d '\r' < target/expected-version.txt)"
          got="$(printf '%s' "$got" | tr -d '\r')"
          echo "image version: [$got]"
          echo "expected: [$want]"
          if [ "$got" != "$want" ]; then
            echo "image --version does not match the release version line" >&2
            exit 1
          fi

      - name: build and load the arm64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/server/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          build-args: |
            ANYBOT_RELEASE_CHANNEL=${{ needs.guard.outputs.channel }}
            ANYBOT_GIT_DESCRIBE=${{ needs.guard.outputs.describe }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.built_at }}
          tags: ${{ needs.guard.outputs.image }}:verify-arm64

      - name: confirm the arm64 image contains the server binary
        env:
          IMAGE: ${{ needs.guard.outputs.image }}
        run: |
          set -euo pipefail
          docker image inspect "${IMAGE}:verify-arm64" >/dev/null
          cid="$(docker create --platform linux/arm64 --entrypoint /bin/true "${IMAGE}:verify-arm64")"
          docker cp "$cid:/usr/local/bin/anybot-server" target/anybot-server-arm64
          docker rm "$cid" >/dev/null
          test -s target/anybot-server-arm64
          file target/anybot-server-arm64 | grep -q 'ARM aarch64'

      - name: run --version inside the arm64 image
        env:
          IMAGE: ${{ needs.guard.outputs.image }}
        run: |
          set -euo pipefail
          got="$(docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/anybot-server "${IMAGE}:verify-arm64" --version)"
          want="$(tr -d '\r' < target/expected-version.txt)"
          got="$(printf '%s' "$got" | tr -d '\r')"
          echo "arm64 image version: [$got]"
          echo "expected: [$want]"
          if [ "$got" != "$want" ]; then
            echo "arm64 image --version does not match the release version line" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image-version
          path: target/expected-version.txt
          retention-days: 7

  publish:
    needs: [guard, desktop, image]
    if: github.event_name != 'release' && needs.guard.outputs.mode == 'publish' && needs.desktop.result == 'success' && needs.image.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: target/downloaded
          merge-multiple: true

      - name: one checksum file
        run: |
          set -euo pipefail
          mkdir -p target/release-page
          find target/downloaded -type f ! -name SHA256SUMS -exec cp {} target/release-page/ \;
          count="$(find target/release-page -type f | wc -l | tr -d ' ')"
          if [ "$count" = 0 ]; then
            echo "no desktop artifacts downloaded" >&2
            exit 1
          fi
          (cd target/release-page && sha256sum -- * > SHA256SUMS)

      - name: release notes
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          BUILT_AT: ${{ needs.guard.outputs.built_at }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: sh deploy/release/render-notes.sh "$CHANNEL" "$COMMIT" "$BUILT_AT" "$TAG"

      - name: publish the dev pre-release or the stable draft
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
          TAG: ${{ needs.guard.outputs.tag }}
          SHA: ${{ needs.guard.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: sh deploy/release/publish-release.sh

      - name: log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: export compile-time release values
        env:
          ANYBOT_RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: sh deploy/release/export-build-env.sh

      - name: image tags
        id: tags
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
          VERSION: ${{ needs.guard.outputs.version }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          IMAGE: ${{ needs.guard.outputs.image }}
        run: |
          set -euo pipefail
          short="$(printf '%s' "$COMMIT" | cut -c1-12)"
          if [ "$CHANNEL" = "dev" ]; then
            moving="dev"
          else
            moving="$VERSION"
          fi
          {
            echo "list<<EOF"
            echo "${IMAGE}:${moving}"
            echo "${IMAGE}:${short}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: push the server image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ANYBOT_RELEASE_CHANNEL=${{ needs.guard.outputs.channel }}
            ANYBOT_GIT_DESCRIBE=${{ needs.guard.outputs.describe }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.built_at }}
          tags: ${{ steps.tags.outputs.list }}

  latest:
    # spec/09 K111: move `latest` only after a non-rc Release is published. A draft does not.
    # This is the only job a `release` event runs.
    if: github.event_name == 'release' && github.event.action == 'released' && github.event.release.prerelease == false && github.event.release.draft == false && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: move the latest tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: sh deploy/release/move-latest.sh
