# Release skeleton (spec/09 K110, K111). No signing, no custom secrets: GITHUB_TOKEN only.
# Rehearsal (ws/rel-* push) checks, builds, and uploads artifacts. It does not
# create a Release, push an image, or move a tag.
name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - dev
      - "ws/rel-**"
  release:
    types:
      - released
  workflow_dispatch:
    inputs:
      mode:
        description: rehearsal or publish
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - publish

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  IMAGE: ghcr.io/igs170911/anybot

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      channel: ${{ steps.mode.outputs.channel }}
      version: ${{ steps.mode.outputs.version }}
      tag: ${{ steps.mode.outputs.tag }}
      commit: ${{ steps.mode.outputs.commit }}
      built_at: ${{ steps.mode.outputs.built_at }}
      describe: ${{ steps.mode.outputs.describe }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: decide mode and refuse a bad tag
        id: mode
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(awk 'BEGIN{p=0} /^\[workspace\.package\]/{p=1; next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)"
          tauri="$(python3 -c 'import json; print(json.load(open("apps/desktop/src-tauri/tauri.conf.json"))["version"])')"
          desktop="$(python3 -c 'import json; print(json.load(open("apps/desktop/package.json"))["version"])')"
          root="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [ "$version" != "$tauri" ] || [ "$version" != "$desktop" ] || [ "$version" != "$root" ]; then
            echo "version mismatch cargo=$version tauri=$tauri desktop=$desktop package=$root" >&2
            exit 1
          fi
          mode="rehearsal"
          channel="dev"
          tag="rehearsal"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$DISPATCH_MODE"
          elif [ "$REF_TYPE" = "tag" ]; then
            mode="publish"
            channel="stable"
            tag="$REF_NAME"
          elif [ "$REF_NAME" = "dev" ]; then
            mode="publish"
            channel="dev"
            tag="dev-build"
          fi
          if [ "$mode" != "rehearsal" ] && [ "$mode" != "publish" ]; then
            echo "unknown mode $mode" >&2
            exit 1
          fi
          if [ "$channel" = "stable" ]; then
            if [ "$tag" != "v$version" ] && ! printf '%s' "$tag" | grep -Eq "^v${version}-rc[.][0-9]+$"; then
              echo "tag $tag does not match workspace version $version" >&2
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$SHA" origin/main; then
              echo "tag $tag is not on main" >&2
              exit 1
            fi
            check="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/statuses" --jq '[.[] | select(.context=="check")] | first | .state // ""')"
            if [ "$check" != "success" ]; then
              echo "commit $SHA has no green check status (got ${check:-none}); refusing to publish" >&2
              exit 1
            fi
          fi
          epoch="$(git log -1 --format=%ct "$SHA")"
          describe="$(git describe --tags --always --abbrev=12 "$SHA")"
          case "$describe" in
            *-dirty*)
              echo "refusing a dirty describe ($describe)" >&2
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "built_at=$epoch" >> "$GITHUB_OUTPUT"
          echo "describe=$describe" >> "$GITHUB_OUTPUT"

  desktop:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.runner }} # pinned in the matrix: macos-15, macos-15-intel, windows-2025, ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: linux bundling packages
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libxdo-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf rpm file-roller

      - name: rust target
        run: rustup target add ${{ matrix.target }}

      - name: pnpm
        run: npm install -g pnpm@12.23.0

      - name: install the web workspace
        run: pnpm install --frozen-lockfile

      - name: export compile-time release values
        env:
          ANYBOT_RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: sh deploy/release/export-build-env.sh

      - name: write the channel overlay
        run: sh deploy/release/tauri-channel.sh target/tauri-channel.json

      - name: bundle the desktop shell
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ../../target/tauri-channel.json

      - name: collect installers
        run: sh deploy/release/collect-bundles.sh "target/release-assets/${{ matrix.target }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: target/release-assets/${{ matrix.target }}
          retention-days: 14

  image:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: export compile-time release values
        env:
          ANYBOT_RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: sh deploy/release/export-build-env.sh

      - name: expected version line
        id: version
        env:
          ANYBOT_GIT_DESCRIBE: ${{ needs.guard.outputs.describe }}
          SOURCE_DATE_EPOCH: ${{ needs.guard.outputs.built_at }}
        run: |
          set -euo pipefail
          mkdir -p target
          line="$(sh deploy/release/version-line.sh)"
          printf '%s\n' "$line" > target/expected-version.txt
          echo "expected $line"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: build and load the amd64 image for --version
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/server/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            ANYBOT_RELEASE_CHANNEL=${{ needs.guard.outputs.channel }}
            ANYBOT_GIT_DESCRIBE=${{ needs.guard.outputs.describe }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.built_at }}
          tags: ${{ env.IMAGE }}:verify

      - name: run --version inside the image
        env:
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          got="$(docker run --rm --entrypoint /usr/local/bin/anybot-server "${IMAGE}:verify" --version)"
          want="$(tr -d '\r' < target/expected-version.txt)"
          got="$(printf '%s' "$got" | tr -d '\r')"
          echo "image version: [$got]"
          echo "expected: [$want]"
          if [ "$got" != "$want" ]; then
            echo "image --version does not match the release version line" >&2
            exit 1
          fi

      - name: build the arm64 image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/server/Dockerfile
          platforms: linux/arm64
          push: false
          build-args: |
            ANYBOT_RELEASE_CHANNEL=${{ needs.guard.outputs.channel }}
            ANYBOT_GIT_DESCRIBE=${{ needs.guard.outputs.describe }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.built_at }}
          tags: ${{ env.IMAGE }}:verify-arm64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image-version
          path: target/expected-version.txt
          retention-days: 7

  publish:
    needs: [guard, desktop, image]
    if: needs.guard.outputs.mode == 'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: target/downloaded
          merge-multiple: true

      - name: one checksum file
        run: |
          set -euo pipefail
          mkdir -p target/release-page
          find target/downloaded -type f ! -name SHA256SUMS -exec cp {} target/release-page/ \;
          (cd target/release-page && sha256sum -- * > SHA256SUMS)

      - name: release notes
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          BUILT_AT: ${{ needs.guard.outputs.built_at }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: sh deploy/release/render-notes.sh "$CHANNEL" "$COMMIT" "$BUILT_AT" "$TAG"

      - name: publish the dev pre-release or the stable draft
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
          TAG: ${{ needs.guard.outputs.tag }}
          SHA: ${{ needs.guard.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease="false"
          draft="true"
          if [ "$CHANNEL" = "dev" ]; then
            prerelease="true"
            draft="false"
          elif printf '%s' "$TAG" | grep -Eq -- '-rc[.][0-9]+$'; then
            prerelease="true"
          fi
          if [ "$CHANNEL" = "dev" ]; then
            git tag -f "$TAG" "$SHA"
            git push origin "refs/tags/${TAG}" --force
            gh release delete "$TAG" --yes || true
            git tag -f "$TAG" "$SHA"
            git push origin "refs/tags/${TAG}" --force
          fi
          flags=""
          if [ "$draft" = "true" ]; then
            flags="--draft"
          fi
          if [ "$prerelease" = "true" ]; then
            flags="$flags --prerelease"
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file target/release-notes.md \
            $flags \
            target/release-page/*

      - name: log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: export compile-time release values
        env:
          ANYBOT_RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: sh deploy/release/export-build-env.sh

      - name: image tags
        id: tags
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
          VERSION: ${{ needs.guard.outputs.version }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          short="$(printf '%s' "$COMMIT" | cut -c1-12)"
          if [ "$CHANNEL" = "dev" ]; then
            moving="dev"
          else
            moving="$VERSION"
          fi
          {
            echo "list<<EOF"
            echo "${IMAGE}:${moving}"
            echo "${IMAGE}:${short}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: push the server image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ANYBOT_RELEASE_CHANNEL=${{ needs.guard.outputs.channel }}
            ANYBOT_GIT_DESCRIBE=${{ needs.guard.outputs.describe }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.built_at }}
          tags: ${{ steps.tags.outputs.list }}

  latest:
    # spec/09 K111: move `latest` only after a non-rc Release is published. A draft does not.
    if: github.event_name == 'release' && github.event.action == 'released' && github.event.release.prerelease == false && github.event.release.draft == false && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: move the latest tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          case "$version" in
            *-*) echo "pre-release $TAG_NAME does not move latest" >&2; exit 1 ;;
          esac
          src="${IMAGE}:${version}"
          docker buildx imagetools create --tag "${IMAGE}:latest" "$src"
