# Release skeleton (spec/09 K110, K111). No signing, no custom secrets: GITHUB_TOKEN only.
# Publish paths are a v* tag push (stable) and a workflow_call with mode=dev
# (the CI workflow calls that only after Linux, Windows, and macOS are green).
# A ws/rel-* push and a manual run are rehearsal: they build and upload artifacts,
# and they do not create a Release, push an image, or move a tag.
# A release: released event runs only the `latest` job.
name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "ws/rel-**"
  release:
    types:
      - released
  workflow_dispatch:
  workflow_call:
    inputs:
      mode:
        description: dev publishes the dev channel; anything else rehearses
        required: true
        type: string
      commit:
        description: commit the caller already checked
        required: true
        type: string

permissions:
  contents: read

# No workflow-level concurrency. A group on this file would cancel a publish
# that has already started when the next tag or dev call arrives. The publish
# job serializes itself and does not cancel.

env:
  CARGO_INCREMENTAL: "0"
  # The image name is only guard's lowercased output. Do not set IMAGE here:
  # github.repository keeps the original case.

jobs:
  guard:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      channel: ${{ steps.mode.outputs.channel }}
      version: ${{ steps.mode.outputs.version }}
      tag: ${{ steps.mode.outputs.tag }}
      commit: ${{ steps.mode.outputs.commit }}
      built_at: ${{ steps.mode.outputs.built_at }}
      describe: ${{ steps.mode.outputs.describe }}
      image: ${{ steps.mode.outputs.image }}
      image_tag: ${{ steps.mode.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: record the dev tip this call can see
        if: github.ref == 'refs/heads/dev'
        run: |
          set -euo pipefail
          mkdir -p target
          git fetch --no-tags origin dev
          git rev-parse origin/dev > target/dev-head.txt

      - name: decide mode and refuse a bad tag
        id: mode
        env:
          CALL_MODE: ${{ inputs.mode || '' }}
          CALL_COMMIT: ${{ inputs.commit || '' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          DEV_HEAD_FILE: target/dev-head.txt
        run: sh deploy/release/guard.sh

  desktop:
    needs: guard
    if: github.event_name != 'release' && needs.guard.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.runner }} # pinned in the matrix: macos-15, macos-15-intel, windows-2025, ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: linux bundling packages
        if: runner.os == 'Linux'
        # Tauri v2 Debian/Ubuntu prerequisites (v2.tauri.app/start/prerequisites, 2026-11-25)
        # plus rpm for the .rpm bundle. file-roller is a desktop archiver and is not required.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
            libxdo-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf rpm

      - name: rust target
        run: rustup target add ${{ matrix.target }}

      - name: pnpm
        shell: bash
        run: |
          set -euo pipefail
          sh tools/install-pnpm.sh
          if ! command -v pnpm >/dev/null 2>&1 && command -v pnpm.cmd >/dev/null 2>&1; then
            printf 'PNPM=pnpm.cmd\n' >> "$GITHUB_ENV"
            pnpm.cmd --version
          else
            command -v pnpm
            pnpm --version
          fi

      - name: install the web workspace
        shell: bash
        run: |
          set -euo pipefail
          "${PNPM:-pnpm}" install --frozen-lockfile

      - name: export compile-time release values
        shell: bash
        env:
          ANYBOT_RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: sh deploy/release/export-build-env.sh

      - name: write the channel overlay
        shell: bash
        env:
          ANYBOT_RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: sh deploy/release/tauri-channel.sh target/tauri-channel.json

      - name: stop Spotlight indexing this checkout
        if: runner.os == 'macOS'
        shell: bash
        # Spotlight indexing the checkout is a known cause of hdiutil
        # "Resource busy" (man mdutil; create-dmg pull 198). Disabling it
        # does not remove the race, so the bundle step still retries.
        run: |
          set -euo pipefail
          sudo mdutil -i off "$GITHUB_WORKSPACE" || true
          touch "$GITHUB_WORKSPACE/.metadata_never_index"

      - name: bundle the desktop shell
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop
          sh ../../deploy/release/dmg-retry.sh \
            "${PNPM:-pnpm}" exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ../../target/tauri-channel.json

      - name: pack the linux archive
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: sh deploy/release/linux-archive.sh "$TARGET"

      - name: collect installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: sh deploy/release/collect-bundles.sh "target/release-assets/${TARGET}" "$TARGET"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.target }}
          path: target/release-assets/${{ matrix.target }}
          retention-days: 14

  image:
    needs: guard
    if: github.event_name != 'release' && needs.guard.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04-arm is the documented GitHub-hosted arm64 label
          # (docs.github.com github-hosted runners, read 2026-11-25).
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }} # pinned in the matrix: ubuntu-24.04, ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: export compile-time release values
        env:
          ANYBOT_RELEASE_CHANNEL: ${{ needs.guard.outputs.channel }}
        run: sh deploy/release/export-build-env.sh

      - name: expected version line
        env:
          ANYBOT_GIT_DESCRIBE: ${{ needs.guard.outputs.describe }}
          SOURCE_DATE_EPOCH: ${{ needs.guard.outputs.built_at }}
          COMMIT: ${{ needs.guard.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p target
          # The image is checked against the commit, not against git describe.
          # A tag-only describe repeats the tag and would hide a missing commit.
          short="$(printf '%s' "$COMMIT" | cut -c1-12)"
          describe="$ANYBOT_GIT_DESCRIBE"
          case "$describe" in
            *-g*) ;;
            *) describe="${describe}-g${short}" ;;
          esac
          line="$(ANYBOT_GIT_DESCRIBE="$describe" sh deploy/release/version-line.sh)"
          printf '%s\n' "$line" > target/expected-version.txt
          echo "expected $line"

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # moby/buildkit:v0.35.1 index digest, Docker Hub, 2026-11-26.
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: log in to ghcr.io
        if: needs.guard.outputs.mode == 'publish'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and load the native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: images/server/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            ANYBOT_RELEASE_CHANNEL=${{ needs.guard.outputs.channel }}
            ANYBOT_GIT_DESCRIBE=${{ needs.guard.outputs.describe }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.built_at }}
          tags: ${{ needs.guard.outputs.image }}:${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Local copy for --version only. The docker exporter is not pushed:
          # docker save/load rewrites OCI media types.
          # https://docs.docker.com/build/metadata/annotations/
          provenance: false

      - name: run --version inside the image
        env:
          IMAGE: ${{ needs.guard.outputs.image }}
          ARCH: ${{ matrix.arch }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          got="$(docker run --rm --entrypoint /usr/local/bin/anybot-server "${IMAGE}:${ARCH}-${RUN_ID}-${RUN_ATTEMPT}" --version)"
          want="$(tr -d '\r' < target/expected-version.txt)"
          got="$(printf '%s' "$got" | tr -d '\r')"
          echo "image version: [$got]"
          echo "expected: [$want]"
          if [ "$got" != "$want" ]; then
            echo "image --version does not match the release version line" >&2
            exit 1
          fi

      - name: push the verified image by digest
        if: needs.guard.outputs.mode == 'publish'
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: images/server/Dockerfile
          platforms: ${{ matrix.platform }}
          load: false
          push: false
          build-args: |
            ANYBOT_RELEASE_CHANNEL=${{ needs.guard.outputs.channel }}
            ANYBOT_GIT_DESCRIBE=${{ needs.guard.outputs.describe }}
            SOURCE_DATE_EPOCH=${{ needs.guard.outputs.built_at }}
          # Same inputs as the loaded build, exported straight to the
          # registry. OCI media types, digest name only. oci-mediatypes
          # defaults to false on type=image.
          # https://docs.docker.com/build/exporters/image-registry/
          provenance: false
          outputs: type=image,name=${{ needs.guard.outputs.image }},push-by-digest=true,push=true,oci-mediatypes=true

      - name: record the pushed digest
        if: needs.guard.outputs.mode == 'publish'
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in
            sha256:*) ;;
            *)
              echo "registry push did not return a digest ($DIGEST)" >&2
              exit 1
              ;;
          esac
          mkdir -p target/image-export
          printf '%s\n' "$DIGEST" > "target/image-export/${ARCH}.digest"
          echo "pushed ${ARCH} ${DIGEST}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.guard.outputs.mode == 'publish'
        with:
          name: server-image-${{ matrix.arch }}
          path: target/image-export/*.digest
          retention-days: 1

  publish:
    needs: [guard, desktop, image]
    if: github.event_name != 'release' && needs.guard.outputs.mode == 'publish' && needs.desktop.result == 'success' && needs.image.result == 'success'
    # Dev and stable do not share a queue. A newly queued run cancels the one
    # already waiting in the same group (docs.github.com control-workflow-concurrency).
    # Separate groups mean a dev publish cannot cancel a waiting stable publish.
    concurrency:
      group: release-publish-${{ needs.guard.outputs.channel }}-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: re-check the dev tip before any write
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
          SHA: ${{ needs.guard.outputs.commit }}
        run: sh deploy/release/recheck-dev.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: target/downloaded
          merge-multiple: true

      - name: one checksum file
        run: |
          set -euo pipefail
          mkdir -p target/release-page target/release-raw
          find target/downloaded -type f ! -name SHA256SUMS -exec cp {} target/release-raw/ \;
          sh deploy/release/sanitize-names.sh target/release-raw target/release-page
          count="$(find target/release-page -type f | wc -l | tr -d ' ')"
          if [ "$count" = 0 ]; then
            echo "no desktop artifacts downloaded" >&2
            exit 1
          fi
          (cd target/release-page && sha256sum -- * > SHA256SUMS)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-image-*
          path: target/image-digests
          merge-multiple: true

      - name: log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # moby/buildkit:v0.35.1 index digest, Docker Hub, 2026-11-26.
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: push one tag for both architectures
        id: push
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
          VERSION: ${{ needs.guard.outputs.version }}
          IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          IMAGE: ${{ needs.guard.outputs.image }}
        run: sh deploy/release/push-images.sh

      - name: release notes
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
          COMMIT: ${{ needs.guard.outputs.commit }}
          BUILT_AT: ${{ needs.guard.outputs.built_at }}
          TAG: ${{ needs.guard.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: sh deploy/release/render-notes.sh "$CHANNEL" "$COMMIT" "$BUILT_AT" "$TAG" "$IMAGE_DIGEST"

      - name: publish the dev pre-release or the stable draft
        env:
          CHANNEL: ${{ needs.guard.outputs.channel }}
          TAG: ${{ needs.guard.outputs.tag }}
          SHA: ${{ needs.guard.outputs.commit }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: sh deploy/release/publish-release.sh

      - name: move the dev image only after the page swap
        if: needs.guard.outputs.channel == 'dev'
        env:
          IMAGE: ${{ needs.guard.outputs.image }}
          COMMIT: ${{ needs.guard.outputs.commit }}
        run: sh deploy/release/move-dev.sh

  latest:
    # spec/09 K111: move `latest` only after a non-rc Release is published. A draft does not.
    # This is the only job a `release` event runs.
    if: github.event_name == 'release' && github.event.action == 'released' && github.event.release.prerelease == false && github.event.release.draft == false && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: log in to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          # moby/buildkit:v0.35.1 index digest, Docker Hub, 2026-11-26.
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: move the latest tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: sh deploy/release/move-latest.sh
