# CI-1 (spec/09 K110, K111): pushes to every branch and pull requests targeting dev run `make check` on Linux.
# A push to `dev` calls the release workflow only after Linux, Windows, and macOS are green.
name: CI
on:
  push:
    # every branch push runs; tags do not (the release workflow handles tags, K111 ④).
    branches:
      - "**"
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI starts from a fresh checkout every time: incremental compilation data only bloats the cache.
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Linux runner homes only. Windows and macOS cannot create /home/runner.
      RUSTUP_HOME: /home/runner/.rustup
      CARGO_HOME: /home/runner/.cargo
    steps:
      # every pin below is the commit its tag points at, read from https://api.github.com/repos/<owner>/<action>/git/refs/tags/<tag>.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the spec-trace baseline compare and gitleaks need the full history.
          fetch-depth: 0

      - name: spec-trace baseline ref
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ] && { [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF" = refs/heads/dev ]; }; then
            if git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
              echo "SPEC_TRACE_REF=$EVENT_BEFORE" >> "$GITHUB_ENV"
            else
              echo "SPEC_TRACE_REF=HEAD" >> "$GITHUB_ENV"
            fi
          else
            git fetch --no-tags origin dev
            BASE=$(git merge-base HEAD origin/dev 2>/dev/null || echo HEAD)
            echo "SPEC_TRACE_REF=$BASE" >> "$GITHUB_ENV"
          fi

      - name: cache rust toolchains, cargo downloads, and cargo tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/bin
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

      - name: rust toolchain
        run: rustup component add rustfmt clippy

      - name: restore the compiled output cache
        # GitHub keeps at most 10 GB of caches per repository; caches are scoped to a branch and
        # only the default branch (main) is readable by every branch. The key has no commit hash:
        # one entry per lockfile, saved on main only (K111).
        id: target-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            !target/pg-install
          key: target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-

      - name: cache the test postgres download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/pg-install
          key: pg-install-${{ runner.os }}-17.6.0

      - name: cache pnpm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-pnpm-12.23.0

      - name: cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: install cargo tools from prebuilt binaries
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME/bin"
          out="$CARGO_HOME/bin/cargo-nextest"
          if [ ! -x "$out" ]; then
          url="https://get.nexte.st/0.9.152/linux"
          curl -sLf "$url" -o nextest.tar.gz
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  nextest.tar.gz" | sha256sum -c -
          tar -xzf nextest.tar.gz
          mv cargo-nextest "$out"
          rm nextest.tar.gz
          fi
          if [ ! -x "$CARGO_HOME/bin/cargo-deny" ]; then
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.1/cargo-deny-0.22.1-x86_64-unknown-linux-musl.tar.gz"
          curl -sLf "$url" -o deny.tar.gz
          echo "13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d  deny.tar.gz" | sha256sum -c -
          tar -xzf deny.tar.gz
          mv cargo-deny-0.22.1-x86_64-unknown-linux-musl/cargo-deny "$CARGO_HOME/bin/cargo-deny"
          rm -r deny.tar.gz cargo-deny-0.22.1-x86_64-unknown-linux-musl
          fi
          if [ ! -x "$CARGO_HOME/bin/cargo-machete" ]; then
          url="https://github.com/bnjbvr/cargo-machete/releases/download/v0.10.1/cargo-machete-v0.10.1-x86_64-unknown-linux-musl.tar.gz"
          curl -sLf "$url" -o machete.tar.gz
          echo "785d381985140ffa172246d82089adeb7f2eb9c774d961c48f77a4494023afb5  machete.tar.gz" | sha256sum -c -
          tar -xzf machete.tar.gz
          mv cargo-machete-v0.10.1-x86_64-unknown-linux-musl/cargo-machete "$CARGO_HOME/bin/cargo-machete"
          rm -r machete.tar.gz cargo-machete-v0.10.1-x86_64-unknown-linux-musl
          fi
          cargo --version
          cargo nextest --version
          cargo deny --version
          cargo machete --version

      - name: install gitleaks and oasdiff from pinned archives
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sLf "$url" -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          url="https://github.com/oasdiff/oasdiff/releases/download/v1.40.0/oasdiff_1.40.0_linux_amd64.tar.gz"
          curl -sLf "$url" -o oasdiff.tar.gz
          echo "2d04b8f41b145809dd554e9be9ca04d21d1b4eedad5af983ddea36832d3c5e0d  oasdiff.tar.gz" | sha256sum -c -
          tar -xzf oasdiff.tar.gz oasdiff
          sudo install -m 0755 oasdiff /usr/local/bin/oasdiff
          rm oasdiff oasdiff.tar.gz
          gitleaks --version
          oasdiff --version

      - name: system packages for the Tauri Rust shell
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: pnpm
        run: sudo npm install -g pnpm@12.23.0

      - name: install the web workspace
        run: pnpm install --frozen-lockfile

      - name: playwright browsers
        run: pnpm --filter=@anybot/e2e exec playwright install --with-deps chromium webkit

      - name: make check
        run: |
          set -euo pipefail
          make check
          sh tools/test-count.sh linux target/nextest.log target/pnpm-test.log

      - name: upload e2e evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-evidence
          path: |
            target/playwright
            target/e2e-screens
          retention-days: 7

      - name: save the compiled output cache on main only
        if: success() && github.ref == 'refs/heads/main' && steps.target-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            !target/pg-install
          key: target-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  # K111 ②: Windows and macOS compile plus the basic tests.
  # dev and main, plus ws/rel-* so a rehearsal sees them before merge.
  # Other work branches and pull requests stay on the Linux `check` job.
  build-windows:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ws/rel-'))
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cache rust toolchains and cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/bin
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

      - name: rust toolchain
        run: rustup component add rustfmt clippy

      - name: install pinned cargo tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.cargo\bin" | Out-Null
          function Install-Pinned($Name, $Url, $Sha, $Archive, $Inner) {
            $dest = Join-Path "$env:USERPROFILE\.cargo\bin" $Name
            if (Test-Path $dest) { return }
            Invoke-WebRequest -Uri $Url -OutFile $Archive
            $got = (Get-FileHash -Algorithm SHA256 $Archive).Hash.ToLower()
            if ($got -ne $Sha) { throw "$Name sha256 mismatch: $got" }
            $extract = Join-Path $env:RUNNER_TEMP "expand-$Name"
            if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            if ($Archive.EndsWith(".zip")) { Expand-Archive $Archive -DestinationPath $extract }
            else { tar -xzf $Archive -C $extract }
            $leaf = Split-Path $Inner -Leaf
            $found = @(Get-ChildItem -Path $extract -Recurse -File -Filter $leaf)
            if ($found.Count -ne 1) { throw "expected one $leaf under $extract, found $($found.Count)" }
            Move-Item $found[0].FullName $dest
            Remove-Item $Archive, $extract -Recurse -Force
          }
          Install-Pinned "cargo-nextest.exe" "https://get.nexte.st/0.9.152/windows" "cc6bf4b6a7ac18e462cd6c9bae67e26921b888249c2988c6acabf3df387ed9d6" "nextest.zip" "cargo-nextest.exe"
          Install-Pinned "cargo-deny.exe" "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.1/cargo-deny-0.22.1-x86_64-pc-windows-msvc.tar.gz" "b8d7e473f54c328cc528ef8aea221c40b5ccac3d63844aa056f86ed0886800a2" "deny.tar.gz" "cargo-deny-0.22.1-x86_64-pc-windows-msvc/cargo-deny.exe"
          Install-Pinned "cargo-machete.exe" "https://github.com/bnjbvr/cargo-machete/releases/download/v0.10.1/cargo-machete-v0.10.1-x86_64-pc-windows-msvc.tar.gz" "64bd4ceae7680af1d1468cc1edbe09c9bea6221f4f525231c8213666eb01fa5a" "machete.tar.gz" "cargo-machete-v0.10.1-x86_64-pc-windows-msvc/cargo-machete.exe"

      - name: compile the product
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          # Skip list is the windows-skip block in docs/testing.md (WIN-1).
          # --lib --bins skips apps/*/tests and crates/*/tests, which pull in the harness.
          # -D warnings: a Windows-only unused import failed the rehearsal as a warning.
          bash tools/windows-skip.sh list
          $skip = @(bash tools/windows-skip.sh list)
          if ($skip.Count -lt 1) { throw "windows skip list is empty" }
          # cargo build does not take rustc flags after --. CARGO_BUILD_WARNINGS
          # denies lint warnings in local packages only (Cargo config, since 1.97).
          # It does not replace build.rustflags. Dependencies stay under --cap-lints.
          $env:CARGO_BUILD_WARNINGS = "deny"
          cargo build --locked --workspace @($skip | ForEach-Object { "--exclude"; $_ }) --lib --bins

      - name: pnpm
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@12.23.0
          if ! command -v pnpm >/dev/null 2>&1 && command -v pnpm.cmd >/dev/null 2>&1; then
            printf 'PNPM=pnpm.cmd\n' >> "$GITHUB_ENV"
            pnpm.cmd --version
          else
            command -v pnpm
            pnpm --version
          fi

      - name: install the web workspace
        shell: bash
        run: |
          set -euo pipefail
          "${PNPM:-pnpm}" install --frozen-lockfile

      - name: basic tests
        shell: bash
        run: |
          set -euo pipefail
          # windows-2025's image readme lists Git, Rust, Node, and jq. It does not
          # list GNU make, so this step runs the same commands as `make test-basic`
          # without invoking make. Cargo and npm are not always on Git Bash PATH.
          export PATH="$HOME/.cargo/bin:${APPDATA:-}/npm:$PATH"
          command -v bash
          command -v cargo
          command -v cargo-nextest
          if ! command -v pnpm >/dev/null 2>&1 && command -v pnpm.cmd >/dev/null 2>&1; then
            export PNPM=pnpm.cmd
          fi
          command -v "${PNPM:-pnpm}"
          mkdir -p target
          # Unit tests inside product packages. The skip list is docs/testing.md.
          # One --exclude per name: a single quoted string is one cargo argument.
          set --
          sh tools/windows-skip.sh list > target/windows-skip.txt
          while IFS= read -r name; do
            set -- "$@" --exclude "$name"
          done < target/windows-skip.txt
          bash tools/test-gate.sh run target/nextest-basic.log cargo nextest run --locked --workspace "$@" --lib --bins --profile quick
          "${PNPM:-pnpm}" -r --no-bail test | tee target/pnpm-test.log
          sh tools/test-count.sh windows target/nextest-basic.log target/pnpm-test.log

  build-macos:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ws/rel-'))
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cache rust toolchains and cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains
            ~/.cargo/registry
            ~/.cargo/bin
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

      - name: rust toolchain
        run: rustup component add rustfmt clippy

      - name: install pinned cargo tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          out="$HOME/.cargo/bin/cargo-nextest"
          if [ ! -x "$out" ]; then
            curl -sLf "https://get.nexte.st/0.9.152/mac" -o nextest.tar.gz
            echo "2fadf57df4243e691f088ee3bff4f4ab9af16da0c95a1db84b5cb1685e098a76  nextest.tar.gz" | shasum -a 256 -c -
            tar -xzf nextest.tar.gz
            mv cargo-nextest "$out"
            rm nextest.tar.gz
          fi
          if [ ! -x "$HOME/.cargo/bin/cargo-deny" ] && [ "$(uname -m)" = "arm64" ]; then
            curl -sLf "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.22.1/cargo-deny-0.22.1-aarch64-apple-darwin.tar.gz" -o deny.tar.gz
            echo "2afa2d672d2b2ee012835528d0c2acb73693ee973a8dc377db0e09d7d8dee9a2  deny.tar.gz" | shasum -a 256 -c -
            tar -xzf deny.tar.gz
            mv cargo-deny-0.22.1-aarch64-apple-darwin/cargo-deny "$HOME/.cargo/bin/cargo-deny"
            rm -r deny.tar.gz cargo-deny-0.22.1-aarch64-apple-darwin
          fi
          if [ ! -x "$HOME/.cargo/bin/cargo-machete" ]; then
            url="https://github.com/bnjbvr/cargo-machete/releases/download/v0.10.1/cargo-machete-v0.10.1-aarch64-apple-darwin.tar.gz"
            sha="0659860970e26179d730d1a2e99fc6513e41fea122ad5451d7ae43234fc1ebab"
            if [ "$(uname -m)" = "x86_64" ]; then
              url="https://github.com/bnjbvr/cargo-machete/releases/download/v0.10.1/cargo-machete-v0.10.1-x86_64-apple-darwin.tar.gz"
              sha="19c7384d636a27032ff0b4695b67e79b75a366e5c0573b220bd12bc71b59b435"
            fi
            curl -sLf "$url" -o machete.tar.gz
            echo "$sha  machete.tar.gz" | shasum -a 256 -c -
            tar -xzf machete.tar.gz
            find . -name cargo-machete -type f -exec mv {} "$HOME/.cargo/bin/cargo-machete" \;
            rm -rf machete.tar.gz cargo-machete-v0.10.1-*
          fi

      - name: pnpm
        run: npm install -g pnpm@12.23.0

      - name: install the web workspace
        run: pnpm install --frozen-lockfile

      - name: compile the workspace
        run: cargo build --workspace --locked --all-targets

      - name: basic tests
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v make
          command -v cargo
          command -v cargo-nextest
          command -v pnpm
          make test-basic
          sh tools/test-count.sh macos target/nextest-basic.log target/pnpm-test.log

  # Visible sequence, not a poll: this job starts only after the three checks succeed.
  # A job that calls another workflow cannot set timeout-minutes (GitHub docs:
  # "Supported keywords for jobs that call a reusable workflow"). Timeouts stay
  # on the jobs inside release.yml. secrets: inherit is omitted: the called
  # workflow uses only the automatic GITHUB_TOKEN.
  release-dev:
    needs: [check, build-windows, build-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.check.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success'
    uses: ./.github/workflows/release.yml
    with:
      mode: dev
      commit: ${{ github.sha }}
    permissions:
      contents: write
      packages: write
