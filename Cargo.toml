[workspace]
resolver = "2"
members = [
    "crates/*",
    # the apps/* glob also scans apps/desktop (a frontend directory with no Cargo.toml), so executables are listed one by one.
    "apps/server",
    "apps/runner-service",
    "apps/agent",
    "apps/cli",
    "apps/desktop/src-tauri",
    "apps/desktop/context",
    "tools/*",
    "tests/harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# internal crates
anybot-foundation = { path = "crates/foundation", version = "0.1.0" }
anybot-protocol = { path = "crates/protocol", version = "0.1.0" }
anybot-domain = { path = "crates/domain", version = "0.1.0" }
anybot-trust = { path = "crates/trust", version = "0.1.0" }
anybot-models = { path = "crates/models", version = "0.1.0" }
anybot-tools = { path = "crates/tools", version = "0.1.0" }
anybot-mcp = { path = "crates/mcp", version = "0.1.0" }
anybot-computers = { path = "crates/computers", version = "0.1.0" }
anybot-runner = { path = "crates/runner", version = "0.1.0" }
anybot-external-agents = { path = "crates/external-agents", version = "0.1.0" }
anybot-store-server = { path = "crates/store-server", version = "0.1.0" }
anybot-store-client = { path = "crates/store-client", version = "0.1.0" }
anybot-sync = { path = "crates/sync", version = "0.1.0" }
anybot-bus = { path = "crates/bus", version = "0.1.0" }
anybot-blob = { path = "crates/blob", version = "0.1.0" }
anybot-channels = { path = "crates/channels", version = "0.1.0" }
anybot-server = { path = "crates/server", version = "0.1.0" }
anybot-migrate-old = { path = "crates/migrate-old", version = "0.1.0" }
anybot-messages = { path = "crates/messages", version = "0.1.0" }
test-harness = { path = "tests/harness", version = "0.1.0" }
# external crates (spec/06)
anyhow = "1"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
jiff = "1"
axum = "0.8"
rand = "0.10"
schemars = { version = "1", features = ["uuid1"] }
yaml_serde = "0.10"
url = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["macros", "rt", "net"] }
socket2 = "0.6"
getrandom = "0.4"
bytes = "1"
trybuild = "1"
utoipa = { version = "6", features = ["yaml", "uuid"] }
uuid = { version = "1", features = ["std", "serde"] }
zeroize = { version = "1", features = ["alloc"] }
proptest = "1"
tower = "0.5"
http-body-util = "0.1"
clap = { version = "4", features = ["derive"] }
regex = "1"
libc = { version = "0.2" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio"] }
thiserror = "2"
tracing = "0.1"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = { version = "0.9", features = ["macros"] }
tokio-stream = "0.1"
sad-web-push = { version = "0.12", default-features = false }
p256 = { version = "0.14", features = ["ecdh", "pkcs8", "pem"] }
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = { version = "0.11", features = ["zeroize"] }
base64 = "0.22"
postgresql_embedded = { version = "0.22", default-features = false, features = ["tokio", "tls-rustls-ring", "theseus"] }
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
missing_errors_doc = { level = "allow", priority = -1 }
missing_panics_doc = { level = "allow", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mem_forget = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
wildcard_enum_match_arm = "deny"
let_underscore_untyped = "deny"
let_underscore_must_use = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
