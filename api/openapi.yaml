openapi: 3.1.0
info:
  title: AnyBot 伺服器 API
  description: AnyBot 新版伺服器的 HTTP API。跟著程式碼產生，文件即合約。
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8787
    description: 本機開發伺服器（M3 只聽本機）
  - url: http://[::1]:8787
    description: 本機 IPv6 開發伺服器
paths:
  /v1/health:
    get:
      tags:
        - system
      summary: 伺服器健康檢查
      description: 回傳伺服器版本、現在時間（RFC 3339）和事件協定版本；不需要身分。
      operationId: get_health
      responses:
        "200":
          description: 伺服器活着
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                now: 2026-01-01T00:00:00Z
                protocol_version: 1
                version: 0.1.0
        "400":
          description: 請求格式錯誤
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
              example:
                status: 400
                title: 請求格式錯誤
                type: https://anybot.test/problems/bad-request
        "500":
          description: 伺服器內部錯誤
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemJson"
              example:
                status: 500
                title: 伺服器內部錯誤
                type: https://anybot.test/problems/internal
      security:
        - {}
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - version
        - now
        - protocol_version
      properties:
        now:
          type: string
        protocol_version:
          type: integer
          format: int32
          minimum: 0
        version:
          type: string
    ProblemJson:
      type: object
      required:
        - type
        - title
        - status
      properties:
        detail:
          type:
            - string
            - "null"
        instance:
          type:
            - string
            - "null"
        status:
          type: integer
          format: int32
          minimum: 0
        title:
          type: string
        type:
          type: string
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
  - bearer: []
tags:
  - name: system
    description: 伺服器本身：健康檢查與啟動狀態