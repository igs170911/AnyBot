  /v1/admin/public-url:
    post:
      tags:
      - admin
      summary: Set the public URL of this server
      description: Admin only; requires the Idempotency-Key header.
      operationId: post_admin_public_url
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicUrlRequest'
            example:
              public_url: https://bot.example.test
        required: true
      responses:
        '200':
          description: URL stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAck'
              example:
                ok: true
        '400':
          description: Bad URL
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The public URL is not a valid http or https URL.
                type: https://anybot.test/problems/problem_bad_request
        '401':
          description: Session rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-login-credentials
                params: {}
                status: 401
                title: This session is no longer valid.
                type: https://anybot.test/problems/account_login_credentials
        '403':
          description: Not an admin
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-admin-only
                params: {}
                status: 403
                title: Only the server admin can do this.
                type: https://anybot.test/problems/account_admin_only
        '409':
          description: Idempotency key conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-conflict
                params: {}
                status: 409
                title: This request id was already used with a different body.
                type: https://anybot.test/problems/account_idempotency_conflict
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/problem_internal
      security:
      - bearer: []
  /v1/health:
    get:
      tags:
      - system
      summary: Server health check
      description: Returns the server version, the current time (RFC 3339) and the event protocol version; no identity required.
      operationId: get_health
      responses:
        '200':
          description: The server is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                now: 2026-01-01T00:00:00Z
                protocol_version: 1
                version: 0.1.0
        '400':
          description: The request was malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The request was malformed.
                type: https://anybot.test/problems/bad-request
        '500':
          description: The server hit an internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - {}
  /v1/server/status:
    get:
      tags:
      - system
      summary: Public server status
      description: Returns version, protocol version, uptime, listen port and the configured public URL; no identity required.
      operationId: get_server_status
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                listen_port: 8787
                protocol_version: 1
                public_url: null
                uptime_ms: 1200
                version: 0.1.0
        '400':
          description: The request was malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The request was malformed.
                type: https://anybot.test/problems/bad-request
        '500':
          description: The server hit an internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - {}
components:
  schemas:
    ActionAck:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
          example: true
    HealthResponse:
      type: object
      required:
      - version
      - now
      - protocol_version
      properties:
        now:
          type: string
          example: 2026-01-01T00:00:00Z
        protocol_version:
          type: integer
          format: int32
          example: 1
          minimum: 0
        version:
          type: string
          example: 0.1.0
    InviteResponse:
      type: object
      required:
      - invite
      properties:
        invite:
          type: string
          example: 2kqj-7mnp
    LoginRequest:
      type: object
      required:
      - account
      - password
      - label
      properties:
        account:
          type: string
          example: alice
        label:
          type: string
          example: phone P
        password:
          type: string
          example: longenough
    LoginSession:
      type: object
      required:
      - session_key
      - account
      properties:
        account:
          type: string
          example: alice
        session_key:
          type: string
          example: a1b2c3d4
    MessageParams:
      type: object
      additionalProperties: {}
      propertyNames:
        type: string
    PasswordChangeRequest:
      type: object
      required:
      - old
      - new
      properties:
        new:
          type: string
          example: newlongenough
        old:
          type: string
          example: longenough
    ProblemJson:
      type: object
      required:
      - type
      - title
      - status
      - code
      - params
      properties:
        code:
          type: string
          example: problem-bad-request
        detail:
          type:
          - string
          - 'null'
          example: developer detail text
        instance:
          type:
          - string
          - 'null'
          example: /v1/health
        params:
          $ref: '#/components/schemas/MessageParams'
        status:
          type: integer
          format: int32
          example: 400
          minimum: 0
        title:
          type: string
          example: The request was malformed.
        type:
          type: string
          example: https://anybot.test/problems/not-found
    PublicUrlRequest:
      type: object
      required:
      - public_url
      properties:
        public_url:
          type: string
          example: https://bot.example.test
    RegisterAck:
      type: object
      required:
      - created
      - admin
      properties:
        admin:
          type: boolean
          example: true
        created:
          type: boolean
          example: true
    RegisterRequest:
      type: object
      required:
      - account
      - password
      - invite
      properties:
        account:
          type: string
          example: bob
        invite:
          type: string
          example: 2kqj-7mnp
        password:
          type: string
          example: longenough
    ResetPasswordRequest:
      type: object
      required:
      - new
      properties:
        new:
          type: string
          example: newlongenough
    StatusResponse:
      type: object
      required:
      - version
      - protocol_version
      - uptime_ms
      - listen_port
      properties:
        listen_port:
          type: integer
          format: int32
          example: 8787
          minimum: 0
        protocol_version:
          type: integer
          format: int32
          example: 1
          minimum: 0
        public_url:
          type:
          - string
          - 'null'
          example: https://bot.example.test
        uptime_ms:
          type: integer
          format: int64
          example: 1200
          minimum: 0
        version:
          type: string
          example: 0.1.0
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
tags:
- name: system
  description: 'the server itself: health, status, stop'
- name: account
  description: accounts, sessions and passwords
- name: admin
  description: admin-only server operations
