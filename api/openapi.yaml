          - 'null'
          example: allow
        card_id:
          type:
          - string
          - 'null'
          example: 018f-card-uuidv7
        criteria: {}
        reason:
          oneOf:
          - $ref: '#/components/schemas/WakeReason'
          - type: 'null'
        stream:
          $ref: '#/components/schemas/StreamSelector'
        task_id:
          type: string
          example: 018f-task-uuidv7
    RegisterAck:
      type: object
      required:
      - created
      - admin
      properties:
        admin:
          type: boolean
          example: true
        created:
          type: boolean
          example: true
    RegisterRequest:
      type: object
      required:
      - account
      - password
      - invite
      properties:
        account:
          type: string
          example: bob
        invite:
          type: string
          example: 2kqj-7mnp
        password:
          type: string
          example: longenough
    ResetPasswordRequest:
      type: object
      required:
      - new
      properties:
        new:
          type: string
          example: newlongenough
    RoundReply:
      type: object
      required:
      - letter_id
      - device_id
      properties:
        device_id:
          type: string
          example: 018f-device-uuidv7
        letter_id:
          type: string
          example: 018f-letter-uuidv7
        reassigned:
          type:
          - string
          - 'null'
          example: offline
    RoundRequest:
      type: object
      required:
      - bot
      properties:
        bot:
          type: string
          example: 018f-bot-uuidv7
        computer:
          type:
          - string
          - 'null'
          example: 018f-device-uuidv7
    SettingEntry:
      type: object
      required:
      - field
      - value
      properties:
        field:
          type: string
          example: accent_color
        item:
          type:
          - string
          - 'null'
          example: 018f-chat-uuidv7
        value:
          type: string
          example: green
    SettingsView:
      type: object
      required:
      - settings
      properties:
        settings:
          type: array
          items:
            $ref: '#/components/schemas/SettingEntry'
    StatusResponse:
      type: object
      required:
      - version
      - protocol_version
      - uptime_ms
      - listen_port
      properties:
        admin_account:
          type:
          - string
          - 'null'
          example: alice
        listen_port:
          type: integer
          format: int32
          example: 8787
          minimum: 0
        protocol_version:
          type: integer
          format: int32
          example: 1
          minimum: 0
        public_url:
          type:
          - string
          - 'null'
          example: https://bot.example.test
        uptime_ms:
          type: integer
          format: int64
          example: 1200
          minimum: 0
        version:
          type: string
          example: 0.1.0
    StoredRecord:
      type: object
      required:
      - seq
      - device_id
      - kind
      - content
      - created_at_ms
      - offline_sent
      properties:
        content: {}
        created_at_ms:
          type: integer
          format: int64
          example: 1700000000100
        device_id:
          type: string
          example: 018f-uuidv7
        kind:
          type: string
          example: message
        offline_sent:
          type: boolean
          example: false
        seq:
          type: integer
          format: int64
          example: 3
        task_id:
          type:
          - string
          - 'null'
          example: 018f-task-uuidv7
        task_seq:
          type:
          - integer
          - 'null'
          format: int64
          example: 7
    StreamSelector:
      oneOf:
      - type: string
        enum:
        - account
      - type: object
        required:
        - bot
        properties:
          bot:
            type: object
            required:
            - id
            properties:
              id:
                type: string
                example: 018f-bot-uuidv7
    TwoStepChallenge:
      type: object
      required:
      - challenge
      - account
      properties:
        account:
          type: string
          example: alice
        challenge:
          type: string
          example: 9f2c4e7a1b3d5f60
    TwoStepCodeRequest:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          example: '123456'
    TwoStepLoginRequest:
      type: object
      required:
      - challenge
      - code
      properties:
        challenge:
          type: string
          example: 9f2c4e7a1b3d5f60
        code:
          type: string
          example: '123456'
    TwoStepSetup:
      type: object
      required:
      - otpauth_uri
      - secret
      - recovery_codes
      properties:
        otpauth_uri:
          type: string
          example: otpauth://totp/AnyBot:alice?secret=GEZDGNBVGY3TQOJQ&issuer=AnyBot&period=30&digits=6
        recovery_codes:
          type: array
          items:
            type: string
          example:
          - 0a1b2c3d4e
          - 5f6a7b8c9d
        secret:
          type: string
          example: GEZDGNBVGY3TQOJQ
    TypingRequest:
      type: object
      required:
      - stream
      - task_id
      - text
      - thinking
      properties:
        stream:
          $ref: '#/components/schemas/StreamSelector'
        task_id:
          type: string
          example: 018f-task-uuidv7
        text:
          type: string
          example: The answer so far
        thinking:
          type: string
          example: ''
    WakeReason:
      type: string
      enum:
      - resume
      - verification
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
tags:
- name: system
  description: 'the server itself: health, status, stop'
- name: account
  description: accounts, sessions and passwords
- name: admin
  description: admin-only server operations
- name: streams
  description: 'record streams: append and replay after N'
- name: computers
  description: 'the computers of an account: list, rename, remove'
- name: mailbox
  description: 'letters for a computer: hand a round over, claim a letter'
- name: push
  description: 'Web Push: the server key and the push subscriptions of an account'
