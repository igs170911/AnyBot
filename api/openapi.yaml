            example:
              ok: true
        required: true
      responses:
        '200':
          description: All sessions closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAck'
              example:
                ok: true
        '400':
          description: Missing idempotency key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-missing
                params: {}
                status: 400
                title: The Idempotency-Key header is required.
                type: https://anybot.test/problems/account_idempotency_missing
        '401':
          description: Session rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-login-credentials
                params: {}
                status: 401
                title: This session is no longer valid.
                type: https://anybot.test/problems/account_login_credentials
        '409':
          description: Idempotency key conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-conflict
                params: {}
                status: 409
                title: This request id was already used with a different body.
                type: https://anybot.test/problems/account_idempotency_conflict
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/problem_internal
      security:
      - bearer: []
  /v1/account/password:
    post:
      tags:
      - account
      summary: Change the caller password
      description: Requires the session bearer key and the Idempotency-Key header; every other session is closed.
      operationId: post_account_password
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            example:
              new: sunny2233
              old: hunter22
        required: true
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAck'
              example:
                ok: true
        '400':
          description: New password too short
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-password-new-short
                params: {}
                status: 400
                title: The new password is too short.
                type: https://anybot.test/problems/account_password_new_short
        '401':
          description: Session rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-login-credentials
                params: {}
                status: 401
                title: This session is no longer valid.
                type: https://anybot.test/problems/account_login_credentials
        '409':
          description: Idempotency key conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-conflict
                params: {}
                status: 409
                title: This request id was already used with a different body.
                type: https://anybot.test/problems/account_idempotency_conflict
        '429':
          description: Password change rate limit reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-password-rate
                params: {}
                status: 429
                title: Too many password change attempts; try again in 5 minutes.
                type: https://anybot.test/problems/account_password_rate
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/problem_internal
      security:
      - bearer: []
  /v1/account/reauth:
    post:
      tags:
      - account
      summary: Enter the password again
      description: Starts a fresh 15 minutes for actions that need a recent password.
      operationId: post_account_reauth
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReenterRequest'
            example:
              password: longenough
        required: true
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAck'
              example:
                ok: true
        '400':
          description: Missing idempotency key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-missing
                params: {}
                status: 400
                title: The Idempotency-Key header is required.
                type: https://anybot.test/problems/account_idempotency_missing
        '401':
          description: Credential rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-login-credentials
                params: {}
                status: 401
                title: This session is no longer valid.
                type: https://anybot.test/problems/account_login_credentials
        '403':
          description: The password is wrong
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-reauth-password-wrong
                params: {}
                status: 403
                title: The password is wrong
                type: https://anybot.test/problems/account_reauth_password_wrong
        '409':
          description: Idempotency key conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-conflict
                params: {}
                status: 409
                title: This request id was already used with a different body.
                type: https://anybot.test/problems/account_idempotency_conflict
        '429':
          description: Too many password attempts
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-password-rate
                params: {}
                status: 429
                title: Too many password change attempts; try again in 5 minutes.
                type: https://anybot.test/problems/account_password_rate
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/problem_internal
      security:
      - bearer: []
  /v1/account/register:
    post:
      tags:
      - account
      summary: Create an account with an invite code
      description: Requires the Idempotency-Key header; the invite code must match the server setting.
      operationId: post_account_register
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              account: alice
              invite: abcd-efgh
              password: hunter22
        required: true
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAck'
              example:
                admin: true
                created: true
        '400':
          description: Missing idempotency key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-missing
                params: {}
                status: 400
                title: The Idempotency-Key header is required.
                type: https://anybot.test/problems/account_idempotency_missing
        '403':
          description: Invite code rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-invite-invalid
                params: {}
                status: 403
                title: The invite code is not valid.
                type: https://anybot.test/problems/account_invite_invalid
        '409':
          description: Idempotency key conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-conflict
                params: {}
                status: 409
                title: This request id was already used with a different body.
                type: https://anybot.test/problems/account_idempotency_conflict
        '429':
          description: Registration rate limit reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-register-rate
                params: {}
                status: 429
                title: Too many registrations from this address; try again in 5 minutes.
                type: https://anybot.test/problems/account_register_rate
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/problem_internal
      security:
      - {}
  /v1/account/two-step/confirm:
    post:
      tags:
      - account
      summary: Confirm the two-step setup
      description: Turns two-step verification on with the pending secret once the current code from it is given; the recovery codes of that setup replace the old ones. Requires the Idempotency-Key header.
      operationId: post_account_two_step_confirm
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepCodeRequest'
            example:
              code: '123456'
        required: true
      responses:
        '200':
          description: Two-step verification is on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAck'
              example:
                ok: true
        '400':
          description: No setup is waiting
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-no-pending
                params: {}
                status: 400
                title: There is no setup waiting for confirmation.
                type: https://anybot.test/problems/account_two_step_no_pending
        '401':
          description: Code missing or wrong
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-setup-code-wrong
                params: {}
                status: 401
                title: The verification code is wrong.
                type: https://anybot.test/problems/account_two_step_setup_code_wrong
        '429':
          description: Too many wrong codes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-rate
                params: {}
                status: 429
                title: Too many wrong verification codes; try again in 5 minutes.
                type: https://anybot.test/problems/account_two_step_rate
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/problem_internal
      security:
      - bearer: []
  /v1/account/two-step/disable:
    post:
      tags:
      - account
      summary: Turn two-step verification off
      description: Requires the current code; the secret and the recovery codes are removed. Answers ok when two-step was already off. Requires the Idempotency-Key header.
      operationId: post_account_two_step_disable
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepCodeRequest'
            example:
              code: '123456'
        required: true
      responses:
        '200':
          description: Two-step verification is off
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAck'
              example:
                ok: true
        '401':
          description: Code missing or wrong
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-setup-code-wrong
                params: {}
                status: 401
                title: The verification code is wrong.
                type: https://anybot.test/problems/account_two_step_setup_code_wrong
        '429':
          description: Too many wrong codes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-rate
                params: {}
                status: 429
                title: Too many wrong verification codes; try again in 5 minutes.
                type: https://anybot.test/problems/account_two_step_rate
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/problem_internal
      security:
      - bearer: []
  /v1/account/two-step/setup:
    post:
      tags:
      - account
      summary: Start setting up two-step verification
      description: Returns a new authenticator secret and 8 recovery codes, shown only this once. Nothing changes until the setup is confirmed. When two-step is already on, the current code is required. Requires the Idempotency-Key header.
      operationId: post_account_two_step_setup
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepCodeRequest'
            example:
              code: '123456'
        required: true
      responses:
        '200':
          description: Setup started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoStepSetup'
              example:
                otpauth_uri: otpauth://totp/AnyBot:alice?secret=GEZDGNBVGY3TQOJQ&issuer=AnyBot&period=30&digits=6
                recovery_codes:
                - 0a1b2c3d4e
                - 5f6a7b8c9d
                secret: GEZDGNBVGY3TQOJQ
        '401':
          description: Current code missing or wrong
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-setup-code-wrong
                params: {}
                status: 401
                title: 'The verification code is wrong: enter the current six digits from your authenticator app.'
                type: https://anybot.test/problems/account_two_step_setup_code_wrong
        '429':
          description: Too many wrong codes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-rate
                params: {}
