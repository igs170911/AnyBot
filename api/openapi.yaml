  /v1/streams/actions:
    post:
      tags:
      - streams
      summary: Delete, clear, restore or permanently delete chat records
      description: |-
        The server records the action itself. Delete and clear hide chat messages and model answers; restore brings them back within 30 days; purge-permanent empties the content of the chat records behind a delete or clear, and keeps their rows. Only the owner of the stream can act on it.
        The Idempotency-Key header is required; the fingerprint covers the stream key, the action and the target, never any content.
      operationId: post_streams_actions
      parameters:
      - name: Idempotency-Key
        in: header
        description: UUID of this action
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordActionRequest'
            example:
              action: clear
              stream: account
              target_seq: null
        required: true
      responses:
        '200':
          description: Sequence of the action record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordActionReply'
              example:
                seq: 9
                stream: account
        '400':
          description: Bad body, missing target, or the action cannot apply to that record
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: record-action-target-invalid
                params: {}
                status: 400
                title: This action cannot be applied to that record.
                type: https://anybot.test/problems/record_action_target_invalid
        '403':
          description: Not allowed to act on this stream
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: record-no-permission
                params: {}
                status: 403
                title: You cannot write this stream.
                type: https://anybot.test/problems/record_no_permission
        '404':
          description: Target record is not in this stream
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: record-action-target-missing
                params: {}
                status: 404
                title: The record to act on is not in this stream.
                type: https://anybot.test/problems/record_action_target_missing
        '409':
          description: Restore after the 30-day window, or same key with a different fingerprint
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: record-restore-expired
                params: {}
                status: 409
                title: The 30-day window to restore this has passed.
                type: https://anybot.test/problems/record_restore_expired
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - bearer: []
  /v1/streams/after:
    get:
      tags:
      - streams
      summary: Records after sequence N on one stream
      description: Carries N and the device id of record N; replies with the next page in order. A stream the caller cannot read is refused.
      operationId: get_streams_after
      parameters:
      - name: stream
        in: query
        description: 'stream key: account/{owner} or bot/{id}'
        required: true
        schema:
          type: string
      - name: after
        in: query
        description: last sequence the client has
        required: true
        schema:
          type: integer
          format: int64
      - name: device_at
        in: query
        description: device id of record N
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Page of records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfterPage'
              example:
                has_more: false
                max_seq: 3
                records:
                - content:
                    text: hi
                  created_at_ms: 1700000000100
                  device_id: 018f-uuidv7
                  kind: message
                  offline_sent: false
                  seq: 3
                stream: account
        '400':
          description: Bad stream key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The request was malformed.
                type: https://anybot.test/problems/bad-request
        '403':
          description: No permission for this stream
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: record-no-permission
                params: {}
                status: 403
                title: You cannot write this stream.
                type: https://anybot.test/problems/record_no_permission
        '409':
          description: Client is ahead of the server
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: sync-after-ahead
                params:
                  max_seq: 45
                status: 409
                title: 'This device is ahead of the server (max_seq 45): please reset the stream.'
                type: https://anybot.test/problems/sync_after_ahead
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - bearer: []
  /v1/streams/append:
    post:
      tags:
      - streams
      summary: Append records to one stream
      description: |-
        Carries up to 1000 records with the device id each one was born with. The server assigns one sequence per record, rejects forbidden kinds, and answers the same for a replay of the same key.
        The Idempotency-Key header is required: the fingerprint covers the stream key and the sorted device ids of the batch.
      operationId: post_streams_append
      parameters:
      - name: Idempotency-Key
        in: header
        description: UUID of this batch
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendRequest'
            example:
              items:
              - content:
                  text: hi
                created_at_ms: 1700000000100
                device_id: 018f-uuidv7
                kind: message
                offline_sent: false
              stream: account
        required: true
      responses:
        '200':
          description: Per-item results in request order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppendReply'
              example:
                results:
                - result: accepted
                  seq: 1
                - result: duplicate
                  seq: 1
                - code: record-id-conflict
                  result: rejected
                stream: account
        '400':
          description: Bad body or missing idempotency key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The request was malformed.
                type: https://anybot.test/problems/bad-request
        '403':
          description: Not allowed to write this stream
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: record-no-permission
                params: {}
                status: 403
                title: You cannot write this stream.
                type: https://anybot.test/problems/record_no_permission
        '409':
          description: Same key with a different fingerprint
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-conflict
                params: {}
                status: 409
                title: This idempotency key was already used for a different request.
                type: https://anybot.test/problems/account_idempotency_conflict
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - bearer: []
  /v1/streams/notifications:
    get:
      tags:
      - streams
      summary: Notification stream of every record stream the caller can see (SSE)
      description: 'Stays open and carries notifications for every stream this caller can see, never record content. A typing event carries the answer a Bot has typed so far, at most once per second per task, and is never stored. The first event is progress: for each stream the current seq and which record that seq is. Then new-records events for whichever stream gained records. A heartbeat line every 15 seconds. One final stream-progress event with the current seq of every stream when the server closes the stream, including when credentials stop working. There is no N on the request and no Last-Event-ID: data is fetched with GET /v1/streams/after. X-Accel-Buffering is set to no.'
      operationId: get_streams_notifications
      parameters:
      - name: init_seq
        in: query
        description: replay account records after this sequence
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: event stream
          content:
            text/event-stream:
              example: |+
                event: progress
                data: {"streams":[{"stream":"account/alice","seq":45,"device_id":"018f-uuidv7"}]}

                :hb

                event: new-records
                data: {"stream":"account/alice","seq":46,"device_id":"018f-uuidv7"}

        '400':
          description: Bad query
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The request was malformed.
                type: https://anybot.test/problems/bad-request
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - bearer: []
  /v1/streams/record:
    get:
      tags:
      - streams
      summary: One record by sequence number
      description: Reads one record of a stream the caller owns. A record that was permanently deleted is refused with record-source-purged, so an evidence reference can show that its source is gone.
      operationId: get_streams_record
      parameters:
      - name: stream
        in: query
        description: Stream key, for example account/alice or bot/<id>
        required: true
        schema:
          type: string
      - name: seq
        in: query
        description: Sequence number of the record
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredRecord'
              example:
                content:
                  text: hi
                created_at_ms: 1700000000100
                device_id: 018f-uuidv7
                kind: message
                offline_sent: false
                seq: 3
        '400':
          description: Bad stream key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The request was malformed.
                type: https://anybot.test/problems/bad-request
        '403':
          description: No permission for this stream
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: record-no-permission
                params: {}
                status: 403
                title: You cannot write this stream.
                type: https://anybot.test/problems/record_no_permission
        '404':
          description: No record with this sequence number
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: record-action-target-missing
                params: {}
                status: 404
                title: The record to act on is not in this stream.
                type: https://anybot.test/problems/record_action_target_missing
        '410':
          description: The record was permanently deleted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: record-source-purged
                params: {}
                status: 410
                title: The source was permanently deleted.
                type: https://anybot.test/problems/record_source_purged
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - bearer: []
  /v1/streams/referee:
    post:
      tags:
      - streams
      summary: Cancel, stop, wake, answer a card or change the done criteria of a task
      description: |-
        A device asks the server to decide. The server records the decision on the bot stream with the task id. A card answer is accepted once per card: the second answer is refused with card-already-answered and names the device that answered first. An answer without a card id is refused with card-answer-stale. An answer for a card that is not the one the task waits for (never shown, replaced by a later card, or the task was stopped or cancelled) is refused with card-not-waiting.
        The Idempotency-Key header is required.
      operationId: post_streams_referee
      parameters:
      - name: Idempotency-Key
        in: header
        description: UUID of this decision
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefereeRequest'
            example:
              action: card_answer
              answer: allow
              card_id: 018f-card-uuidv7
              stream:
                bot:
                  id: 018f-bot-uuidv7
              task_id: 018f-task-uuidv7
        required: true
      responses:
        '200':
          description: Sequence of the decision record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefereeReply'
              example:
                seq: 12
                stream:
                  bot:
                    id: 018f-bot-uuidv7
        '400':
          description: Bad body or a field this action needs is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: referee-malformed
                params: {}
                status: 400
                title: This referee request is missing a field it needs.
                type: https://anybot.test/problems/referee_malformed
        '403':
          description: Not allowed to act on this stream
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: record-no-permission
                params: {}
                status: 403
                title: You cannot write this stream.
                type: https://anybot.test/problems/record_no_permission
        '409':
          description: The card was already answered, is no longer waiting, or the page is out of date (no card id)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: card-already-answered
                params:
                  device: 018f-uuidv7
                status: 409
                title: This card was already answered from 018f-uuidv7.
                type: https://anybot.test/problems/card_already_answered
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - bearer: []
  /v1/streams/typing:
    post:
      tags:
      - streams
      summary: Hand the answer typed so far to the devices that are watching
      description: 'Only a computer credential that may write the Bot stream can call this. The body carries the whole answer typed so far, and the thinking so far (an empty string when there is none). The server forwards it as a typing event on the notification stream of every connection that can see the Bot stream, at most once per second per task for each connection, and keeps nothing: no database row, no record. It is a hint, not a record. The Idempotency-Key header is required; a repeat is another hint and is not stored.'
      operationId: post_streams_typing
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TypingRequest'
            example:
              stream:
                bot:
                  id: 018f-bot-uuidv7
              task_id: 018f-task-uuidv7
              text: The answer so far
              thinking: ''
        required: true
      responses:
        '204':
          description: Forwarded
        '400':
          description: Bad body, or the stream is not a Bot stream
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The request was malformed.
                type: https://anybot.test/problems/bad-request
        '403':
          description: Not a computer credential, or not allowed to write this Bot stream
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: device-no-permission
                params: {}
                status: 403
                title: This device cannot do that.
                type: https://anybot.test/problems/device_no_permission
        '413':
          description: Body larger than the write limit
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 413
                title: The request body is too large.
                type: https://anybot.test/problems/bad-request
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - bearer: []
components:
  schemas:
    ActionAck:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
          example: true
    AfterPage:
      type: object
      required:
      - stream
      - records
      - has_more
      - max_seq
      properties:
        has_more:
          type: boolean
          example: false
        max_seq:
          type: integer
          format: int64
          example: 45
        records:
          type: array
          items:
            $ref: '#/components/schemas/StoredRecord'
        stream:
          $ref: '#/components/schemas/StreamSelector'
    AppendReply:
      type: object
      required:
      - stream
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AppendResult'
        stream:
          $ref: '#/components/schemas/StreamSelector'
    AppendRequest:
      type: object
      required:
      - stream
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecordItem'
        stream:
          $ref: '#/components/schemas/StreamSelector'
    AppendResult:
      type: object
      required:
      - result
      properties:
        code:
          type:
          - string
          - 'null'
          example: record-id-conflict
        result:
          type: string
          example: accepted
        seq:
          type:
          - integer
          - 'null'
          format: int64
          example: 1
    ClaimReply:
      type: object
      required:
      - letter_id
      - kind
      - content
      properties:
        content:
          type: object
        kind:
          type: string
          example: round
        letter_id:
          type: string
          example: 018f-letter-uuidv7
    ClaimRequest:
      type: object
      required:
      - letter_id
      properties:
        letter_id:
          type: string
          example: 018f-letter-uuidv7
    ComputerDelegateRequest:
      type: object
      required:
      - device_id
      - enabled
      properties:
        device_id:
          type: string
          example: 018f-device-uuidv7
        enabled:
          type: boolean
          example: true
    ComputerRemoveRequest:
      type: object
      required:
      - device_id
      properties:
        device_id:
          type: string
          example: 018f-device-uuidv7
    ComputerRenameRequest:
      type: object
      required:
      - device_id
      - name
      properties:
        device_id:
          type: string
          example: 018f-device-uuidv7
        name:
          type: string
          example: study Mac
    ComputerView:
      type: object
      required:
      - device_id
      - name
      - online
      - delegate_enabled
      - paired
      properties:
        delegate_enabled:
          type: boolean
          example: false
        device_id:
          type: string
          example: 018f-device-uuidv7
        name:
          type: string
          example: desk
        offline_at_ms:
          type:
          - integer
          - 'null'
          format: int64
          example: 1700000000000
        offline_reason:
          type:
          - string
          - 'null'
          example: computers-offline-no-signal
        online:
          type: boolean
          example: true
        paired:
          type: boolean
          example: false
    ComputersView:
      type: object
      required:
      - computers
