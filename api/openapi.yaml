openapi: 3.1.0
info:
  title: AnyBot Server API
  description: HTTP API of the new AnyBot server. Generated from the code; the document is the contract.
  contact:
    name: AnyBot dev team
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
  version: 0.1.0
servers:
- url: http://127.0.0.1:8787
  description: loopback development server (M3 listens on loopback only)
- url: http://[::1]:8787
  description: loopback IPv6 development server
paths:
  /v1/health:
    get:
      tags:
      - system
      summary: Server health check
      description: Returns the server version, the current time (RFC 3339) and the event protocol version; no identity required.
      operationId: get_health
      responses:
        '200':
          description: The server is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                now: 2026-01-01T00:00:00Z
                protocol_version: 1
                version: 0.1.0
        '400':
          description: The request was malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The request was malformed.
                type: https://anybot.test/problems/bad-request
        '500':
          description: The server hit an internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - {}
  /v1/server/status:
    get:
      tags:
      - system
      summary: Public server status
      description: Returns version, protocol version, uptime, listen port and the configured public URL; no identity required.
      operationId: get_server_status
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                listen_port: 8787
                protocol_version: 1
                public_url: null
                uptime_ms: 1200
                version: 0.1.0
        '400':
          description: The request was malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The request was malformed.
                type: https://anybot.test/problems/bad-request
        '500':
          description: The server hit an internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - {}
  /v1/server/stop:
    post:
      tags:
      - system
      summary: Ask the server to stop
      description: Requests a graceful stop of the running server. The Idempotency-Key header is required for this write.
      operationId: post_server_stop
      parameters:
      - name: Idempotency-Key
        in: header
        description: Unique key for this write request
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Stop requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopAck'
              example:
                stopping: true
        '400':
          description: The request was malformed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-bad-request
                params: {}
                status: 400
                title: The request was malformed.
                type: https://anybot.test/problems/bad-request
        '500':
          description: The server hit an internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/internal
      security:
      - {}
components:
  schemas:
    HealthResponse:
      type: object
      required:
      - version
      - now
      - protocol_version
      properties:
        now:
          type: string
          example: 2026-01-01T00:00:00Z
        protocol_version:
          type: integer
          format: int32
          example: 1
          minimum: 0
        version:
          type: string
          example: 0.1.0
    MessageParams:
      type: object
      additionalProperties: {}
      propertyNames:
        type: string
    ProblemJson:
      type: object
      required:
      - type
      - title
      - status
      - code
      - params
      properties:
        code:
          type: string
          example: problem-bad-request
        detail:
          type:
          - string
          - 'null'
          example: developer detail text
        instance:
          type:
          - string
          - 'null'
          example: /v1/health
        params:
          $ref: '#/components/schemas/MessageParams'
        status:
          type: integer
          format: int32
          example: 400
          minimum: 0
        title:
          type: string
          example: The request was malformed.
        type:
          type: string
          example: https://anybot.test/problems/not-found
    StatusResponse:
      type: object
      required:
      - version
      - protocol_version
      - uptime_ms
      - listen_port
      properties:
        listen_port:
          type: integer
          format: int32
          example: 8787
          minimum: 0
        protocol_version:
          type: integer
          format: int32
          example: 1
          minimum: 0
        public_url:
          type:
          - string
          - 'null'
          example: https://bot.example.test
        uptime_ms:
          type: integer
          format: int64
          example: 1200
          minimum: 0
        version:
          type: string
          example: 0.1.0
    StopAck:
      type: object
      required:
      - stopping
      properties:
        stopping:
          type: boolean
          example: true
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
security:
- bearer: []
tags:
- name: system
  description: 'the server itself: health, status, stop'
