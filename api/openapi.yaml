openapi: 3.1.0
info:
  title: AnyBot Server API
  description: HTTP API of the new AnyBot server. Generated from the code; the document is the contract.
  contact:
    name: AnyBot dev team
  license:
    name: MIT OR Apache-2.0
    identifier: MIT OR Apache-2.0
  version: 0.1.0
servers:
- url: http://127.0.0.1:8787
  description: loopback development server (M3 listens on loopback only)
- url: http://[::1]:8787
  description: loopback IPv6 development server
paths:
  /v1/account/login:
    post:
      tags:
      - account
      summary: Log in and open a session
      description: Requires the Idempotency-Key header; replaying the same key opens a new session.
      operationId: post_account_login
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              account: alice
              credential: bearer
              label: phone
              password: hunter22
        required: true
      responses:
        '200':
          description: Session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSession'
              example:
                account: alice
                bearer_key: a1b2c3d4e5f6a1b2
                device_id: d1
        '202':
          description: Password accepted; the two-step code is required next
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoStepChallenge'
              example:
                account: alice
                challenge: 9f2c4e7a1b3d5f60
        '400':
          description: Missing idempotency key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-missing
                params: {}
                status: 400
                title: The Idempotency-Key header is required.
                type: https://anybot.test/problems/account_idempotency_missing
        '401':
          description: Wrong credentials
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-login-credentials
                params: {}
                status: 401
                title: The account or password is wrong.
                type: https://anybot.test/problems/account_login_credentials
        '403':
          description: Disabled account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-login-disabled
                params: {}
                status: 403
                title: This account is disabled by the server admin.
                type: https://anybot.test/problems/account_login_disabled
        '409':
          description: Idempotency key conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-conflict
                params: {}
                status: 409
                title: This request id was already used with a different body.
                type: https://anybot.test/problems/account_idempotency_conflict
        '429':
          description: Login rate limit reached
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-login-rate
                params: {}
                status: 429
                title: Too many password failures; try again in 5 minutes.
                type: https://anybot.test/problems/account_login_rate
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/problem_internal
      security:
      - {}
  /v1/account/login/two-step:
    post:
      tags:
      - account
      summary: Finish a login with the two-step code
      description: Second step after the password was accepted. Requires the Idempotency-Key header; the record is bound to the source address. The credential kind is the one the first step asked for.
      operationId: post_account_login_two_step
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoStepLoginRequest'
            example:
              challenge: 9f2c4e7a1b3d5f60
              code: '123456'
        required: true
      responses:
        '200':
          description: Session opened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSession'
              example:
                account: alice
                bearer_key: a1b2c3d4e5f6a1b2
                device_id: d1
        '400':
          description: Challenge expired or used up
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-expired
                params: {}
                status: 400
                title: This login has expired; enter your password again.
                type: https://anybot.test/problems/account_two_step_expired
        '401':
          description: Wrong code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-code-wrong
                params: {}
                status: 401
                title: The verification code is wrong.
                type: https://anybot.test/problems/account_two_step_code_wrong
        '409':
          description: Idempotency key conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-conflict
                params: {}
                status: 409
                title: This request id was already used with a different body.
                type: https://anybot.test/problems/account_idempotency_conflict
        '429':
          description: Too many wrong codes
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-rate
                params: {}
                status: 429
                title: Too many wrong verification codes; try again in 5 minutes.
                type: https://anybot.test/problems/account_two_step_rate
        '500':
          description: The stored secret cannot be opened
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-two-step-unreadable
                params: {}
                status: 500
                title: The two-step secret of this account cannot be opened on this server.
                type: https://anybot.test/problems/account_two_step_unreadable
      security:
      - {}
  /v1/account/logout:
    post:
      tags:
      - account
      summary: Close the calling session
      description: Requires the session bearer key and the Idempotency-Key header.
      operationId: post_account_logout
      parameters:
      - name: Idempotency-Key
        in: header
        description: client-generated idempotency key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionAck'
            example:
              ok: true
        required: true
      responses:
        '200':
          description: Session closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAck'
              example:
                ok: true
        '400':
          description: Missing idempotency key
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-missing
                params: {}
                status: 400
                title: The Idempotency-Key header is required.
                type: https://anybot.test/problems/account_idempotency_missing
        '401':
          description: Session rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-login-credentials
                params: {}
                status: 401
                title: This session is no longer valid.
                type: https://anybot.test/problems/account_login_credentials
        '409':
          description: Idempotency key conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: account-idempotency-conflict
                params: {}
                status: 409
                title: This request id was already used with a different body.
                type: https://anybot.test/problems/account_idempotency_conflict
        '500':
          description: Internal error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
              example:
                code: problem-internal
                params: {}
                status: 500
                title: The server hit an internal error.
                type: https://anybot.test/problems/problem_internal
      security:
      - bearer: []
  /v1/account/logout-all:
    post:
      tags:
      - account
      summary: Close every phone and browser session of the account
      description: Requires the session bearer key and the Idempotency-Key header.
      operationId: post_account_logout_all
