asyncapi: 3.0.0
channels:
  runEvents:
    address: /v1/tasks/{taskId}/events/stream
    description: 依任務推送事件；每則有遞增編號。
    messages:
      runEvent:
        payload:
          $ref: "#/components/schemas/runEventEnvelope"
components:
  messages:
    approval_card:
      name: approval_card
      payload:
        properties:
          data:
            properties:
              card_id:
                $ref: "#/$defs/CardId"
              options:
                items:
                  type: string
                type: array
              summary:
                type: string
              turn_id:
                $ref: "#/$defs/TurnId"
            required:
              - turn_id
              - card_id
              - summary
              - options
            type: object
          kind:
            const: approval_card
            type: string
        required:
          - kind
          - data
        type: object
      summary: 執行事件協定的事件種類
      title: approval_card
    evidence_added:
      name: evidence_added
      payload:
        properties:
          data:
            properties:
              blob_id:
                $ref: "#/$defs/BlobId"
              evidence_id:
                $ref: "#/$defs/EvidenceId"
              summary:
                type: string
              turn_id:
                $ref: "#/$defs/TurnId"
            required:
              - turn_id
              - evidence_id
              - summary
              - blob_id
            type: object
          kind:
            const: evidence_added
            type: string
        required:
          - kind
          - data
        type: object
      summary: 執行事件協定的事件種類
      title: evidence_added
    run_error:
      name: run_error
      payload:
        properties:
          data:
            properties:
              message:
                type: string
            required:
              - message
            type: object
          kind:
            const: run_error
            type: string
        required:
          - kind
          - data
        type: object
      summary: 執行事件協定的事件種類
      title: run_error
    task_status_changed:
      name: task_status_changed
      payload:
        properties:
          data:
            properties:
              status:
                $ref: "#/$defs/TaskStatus"
            required:
              - status
            type: object
          kind:
            const: task_status_changed
            type: string
        required:
          - kind
          - data
        type: object
      summary: 執行事件協定的事件種類
      title: task_status_changed
    tool_call_result:
      name: tool_call_result
      payload:
        properties:
          data:
            properties:
              call_id:
                $ref: "#/$defs/CallId"
              ok:
                type: boolean
              output: true
              turn_id:
                $ref: "#/$defs/TurnId"
            required:
              - turn_id
              - call_id
              - ok
              - output
            type: object
          kind:
            const: tool_call_result
            type: string
        required:
          - kind
          - data
        type: object
      summary: 執行事件協定的事件種類
      title: tool_call_result
    tool_call_started:
      name: tool_call_started
      payload:
        properties:
          data:
            properties:
              args: true
              call_id:
                $ref: "#/$defs/CallId"
              name:
                type: string
              turn_id:
                $ref: "#/$defs/TurnId"
            required:
              - turn_id
              - call_id
              - name
              - args
            type: object
          kind:
            const: tool_call_started
            type: string
        required:
          - kind
          - data
        type: object
      summary: 執行事件協定的事件種類
      title: tool_call_started
    turn_ended:
      name: turn_ended
      payload:
        properties:
          data:
            properties:
              turn_id:
                $ref: "#/$defs/TurnId"
            required:
              - turn_id
            type: object
          kind:
            const: turn_ended
            type: string
        required:
          - kind
          - data
        type: object
      summary: 執行事件協定的事件種類
      title: turn_ended
    turn_started:
      name: turn_started
      payload:
        properties:
          data:
            properties:
              turn_id:
                $ref: "#/$defs/TurnId"
            required:
              - turn_id
            type: object
          kind:
            const: turn_started
            type: string
        required:
          - kind
          - data
        type: object
      summary: 執行事件協定的事件種類
      title: turn_started
    turn_text:
      name: turn_text
      payload:
        properties:
          data:
            properties:
              text:
                type: string
              turn_id:
                $ref: "#/$defs/TurnId"
            required:
              - turn_id
              - text
            type: object
          kind:
            const: turn_text
            type: string
        required:
          - kind
          - data
        type: object
      summary: 執行事件協定的事件種類
      title: turn_text
    turn_thinking:
      name: turn_thinking
      payload:
        properties:
          data:
            properties:
              text:
                type: string
              turn_id:
                $ref: "#/$defs/TurnId"
            required:
              - turn_id
              - text
            type: object
          kind:
            const: turn_thinking
            type: string
        required:
          - kind
          - data
        type: object
      summary: 執行事件協定的事件種類
      title: turn_thinking
  schemas:
    runEventEnvelope:
      $defs:
        BlobId:
          format: uuid
          type: string
        CallId:
          format: uuid
          type: string
        CardId:
          format: uuid
          type: string
        EventId:
          format: uuid
          type: string
        EventKind:
          oneOf:
            - properties:
                data:
                  properties:
                    turn_id:
                      $ref: "#/$defs/TurnId"
                  required:
                    - turn_id
                  type: object
                kind:
                  const: turn_started
                  type: string
              required:
                - kind
                - data
              type: object
            - properties:
                data:
                  properties:
                    text:
                      type: string
                    turn_id:
                      $ref: "#/$defs/TurnId"
                  required:
                    - turn_id
                    - text
                  type: object
                kind:
                  const: turn_text
                  type: string
              required:
                - kind
                - data
              type: object
            - properties:
                data:
                  properties:
                    text:
                      type: string
                    turn_id:
                      $ref: "#/$defs/TurnId"
                  required:
                    - turn_id
                    - text
                  type: object
                kind:
                  const: turn_thinking
                  type: string
              required:
                - kind
                - data
              type: object
            - properties:
                data:
                  properties:
                    turn_id:
                      $ref: "#/$defs/TurnId"
                  required:
                    - turn_id
                  type: object
                kind:
                  const: turn_ended
                  type: string
              required:
                - kind
                - data
              type: object
            - properties:
                data:
                  properties:
                    args: true
                    call_id:
                      $ref: "#/$defs/CallId"
                    name:
                      type: string
                    turn_id:
                      $ref: "#/$defs/TurnId"
                  required:
                    - turn_id
                    - call_id
                    - name
                    - args
                  type: object
                kind:
                  const: tool_call_started
                  type: string
              required:
                - kind
                - data
              type: object
            - properties:
                data:
                  properties:
                    call_id:
                      $ref: "#/$defs/CallId"
                    ok:
                      type: boolean
                    output: true
                    turn_id:
                      $ref: "#/$defs/TurnId"
                  required:
                    - turn_id
                    - call_id
                    - ok
                    - output
                  type: object
                kind:
                  const: tool_call_result
                  type: string
              required:
                - kind
                - data
              type: object
            - properties:
                data:
                  properties:
                    card_id:
                      $ref: "#/$defs/CardId"
                    options:
                      items:
                        type: string
                      type: array
                    summary:
                      type: string
                    turn_id:
                      $ref: "#/$defs/TurnId"
                  required:
                    - turn_id
                    - card_id
                    - summary
                    - options
                  type: object
                kind:
                  const: approval_card
                  type: string
              required:
                - kind
                - data
              type: object
            - properties:
                data:
                  properties:
                    blob_id:
                      $ref: "#/$defs/BlobId"
                    evidence_id:
                      $ref: "#/$defs/EvidenceId"
                    summary:
                      type: string
                    turn_id:
                      $ref: "#/$defs/TurnId"
                  required:
                    - turn_id
                    - evidence_id
                    - summary
                    - blob_id
                  type: object
                kind:
                  const: evidence_added
                  type: string
              required:
                - kind
                - data
              type: object
            - properties:
                data:
                  properties:
                    status:
                      $ref: "#/$defs/TaskStatus"
                  required:
                    - status
                  type: object
                kind:
                  const: task_status_changed
                  type: string
              required:
                - kind
                - data
              type: object
            - properties:
                data:
                  properties:
                    message:
                      type: string
                  required:
                    - message
                  type: object
                kind:
                  const: run_error
                  type: string
              required:
                - kind
                - data
              type: object
        EvidenceId:
          format: uuid
          type: string
        TaskId:
          format: uuid
          type: string
        TaskStatus:
          enum:
            - queued
            - running
            - paused
            - awaiting_approval
            - completed
            - failed
            - cancelled
          type: string
        TurnId:
          format: uuid
          type: string
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        at_ms:
          format: uint64
          minimum: 0
          type: integer
        event_id:
          $ref: "#/$defs/EventId"
        kind:
          $ref: "#/$defs/EventKind"
        protocol_version:
          format: uint32
          minimum: 0
          type: integer
        seq:
          format: uint64
          minimum: 0
          type: integer
        task_id:
          $ref: "#/$defs/TaskId"
      required:
        - event_id
        - task_id
        - seq
        - at_ms
        - protocol_version
        - kind
      title: RunEvent
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  description: 伺服器推給執行端與畫面的執行事件，走 SSE；內容 schema 由 Rust 型別產生。
  title: AnyBot 執行事件協定
  version: "1"
operations:
  streamRunEvents:
    action: receive
    channel:
      $ref: "#/channels/runEvents"
    description: 客戶端從伺服器接收事件串流
    messages:
      - "#/components/messages/approval_card"
      - "#/components/messages/evidence_added"
      - "#/components/messages/run_error"
      - "#/components/messages/task_status_changed"
      - "#/components/messages/tool_call_result"
      - "#/components/messages/tool_call_started"
      - "#/components/messages/turn_ended"
      - "#/components/messages/turn_started"
      - "#/components/messages/turn_text"
      - "#/components/messages/turn_thinking"
    security:
      - bearer: []