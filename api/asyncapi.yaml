asyncapi: 3.0.0
channels:
  runEvents:
    address: /v1/tasks/{taskId}/events/stream
    description: 依任務推送事件；每則有遞增編號。
    messages:
      approval_card:
        $ref: '#/components/messages/approval_card'
      evidence_added:
        $ref: '#/components/messages/evidence_added'
      run_error:
        $ref: '#/components/messages/run_error'
      task_status_changed:
        $ref: '#/components/messages/task_status_changed'
      tool_call_result:
        $ref: '#/components/messages/tool_call_result'
      tool_call_started:
        $ref: '#/components/messages/tool_call_started'
      turn_ended:
        $ref: '#/components/messages/turn_ended'
      turn_started:
        $ref: '#/components/messages/turn_started'
      turn_text:
        $ref: '#/components/messages/turn_text'
      turn_thinking:
        $ref: '#/components/messages/turn_thinking'
components:
  messages:
    approval_card:
      name: approval_card
      payload:
        properties:
          data:
            properties:
              card_id:
                $ref: '#/components/schemas/CardId'
              options:
                items:
                  type: string
                type: array
              summary:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - card_id
            - summary
            - options
            type: object
          kind:
            const: approval_card
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: 執行事件協定的事件種類
      title: approval_card
    evidence_added:
      name: evidence_added
      payload:
        properties:
          data:
            properties:
              blob_id:
                $ref: '#/components/schemas/BlobId'
              evidence_id:
                $ref: '#/components/schemas/EvidenceId'
              summary:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - evidence_id
            - summary
            - blob_id
            type: object
          kind:
            const: evidence_added
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: 執行事件協定的事件種類
      title: evidence_added
    run_error:
      name: run_error
      payload:
        properties:
          data:
            properties:
              message:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - message
            type: object
          kind:
            const: run_error
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: 執行事件協定的事件種類
      title: run_error
    task_status_changed:
      name: task_status_changed
      payload:
        properties:
          data:
            properties:
              detail:
                anyOf:
                - $ref: '#/components/schemas/CompletedDetail'
                - type: 'null'
              status:
                $ref: '#/components/schemas/TaskStatus'
              task_id:
                $ref: '#/components/schemas/TaskId'
            required:
            - task_id
            - status
            type: object
          kind:
            const: task_status_changed
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: 執行事件協定的事件種類
      title: task_status_changed
    tool_call_result:
      name: tool_call_result
      payload:
        properties:
          data:
            properties:
              call_id:
                $ref: '#/components/schemas/CallId'
              ok:
                examples:
                - true
                type: boolean
              output: true
            required:
            - call_id
            - ok
            - output
            type: object
          kind:
            const: tool_call_result
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: 執行事件協定的事件種類
      title: tool_call_result
    tool_call_started:
      name: tool_call_started
      payload:
        properties:
          data:
            properties:
              args: true
              call_id:
                $ref: '#/components/schemas/CallId'
              name:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - call_id
            - name
            - args
            type: object
          kind:
            const: tool_call_started
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: 執行事件協定的事件種類
      title: tool_call_started
    turn_ended:
      name: turn_ended
      payload:
        properties:
          data:
            type: object
          kind:
            const: turn_ended
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: 執行事件協定的事件種類
      title: turn_ended
    turn_started:
      name: turn_started
      payload:
        properties:
          data:
            type: object
          kind:
            const: turn_started
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: 執行事件協定的事件種類
      title: turn_started
    turn_text:
      name: turn_text
      payload:
        properties:
          data:
            properties:
              text:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - text
            type: object
          kind:
            const: turn_text
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: 執行事件協定的事件種類
      title: turn_text
    turn_thinking:
      name: turn_thinking
      payload:
        properties:
          data:
            properties:
              text:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - text
            type: object
          kind:
            const: turn_thinking
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: 執行事件協定的事件種類
      title: turn_thinking
  schemas:
    BlobId:
      format: uuid
      type: string
    CallId:
      format: uuid
      type: string
    CardId:
      format: uuid
      type: string
    CompletedDetail:
      enum:
      - delivered
      - user_confirmed
      - accepted
      - unverified
      - stopped
      - cancelled
      type: string
    EventId:
      format: uuid
      type: string
    EventKind:
      anyOf:
      - $ref: '#/components/schemas/KnownEventKind'
      - $ref: '#/components/schemas/RawEventKind'
    EvidenceId:
      format: uuid
      type: string
    KnownEventKind:
      oneOf:
      - properties:
          data:
            type: object
          kind:
            const: turn_started
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              text:
                type: string
            required:
            - text
            type: object
          kind:
            const: turn_text
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              text:
                type: string
            required:
            - text
            type: object
          kind:
            const: turn_thinking
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            type: object
          kind:
            const: turn_ended
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              args: true
              call_id:
                $ref: '#/components/schemas/CallId'
              name:
                type: string
            required:
            - call_id
            - name
            - args
            type: object
          kind:
            const: tool_call_started
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              call_id:
                $ref: '#/components/schemas/CallId'
              ok:
                type: boolean
              output: true
            required:
            - call_id
            - ok
            - output
            type: object
          kind:
            const: tool_call_result
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              card_id:
                $ref: '#/components/schemas/CardId'
              options:
                items:
                  type: string
                type: array
              summary:
                type: string
            required:
            - card_id
            - summary
            - options
            type: object
          kind:
            const: approval_card
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              blob_id:
                $ref: '#/components/schemas/BlobId'
              evidence_id:
                $ref: '#/components/schemas/EvidenceId'
              summary:
                type: string
            required:
            - evidence_id
            - summary
            - blob_id
            type: object
          kind:
            const: evidence_added
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              detail:
                anyOf:
                - $ref: '#/components/schemas/CompletedDetail'
                - type: 'null'
              status:
                $ref: '#/components/schemas/TaskStatus'
              task_id:
                $ref: '#/components/schemas/TaskId'
            required:
            - task_id
            - status
            type: object
          kind:
            const: task_status_changed
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              message:
                type: string
            required:
            - message
            type: object
          kind:
            const: run_error
            type: string
        required:
        - kind
        - data
        type: object
    RawEventKind:
      properties:
        data: true
        kind:
          type: string
      required:
      - kind
      - data
      type: object
    TaskId:
      format: uuid
      type: string
    TaskStatus:
      enum:
      - running
      - awaiting_user
      - stuck
      - completed
      - failed
      type: string
    TurnId:
      format: uuid
      type: string
    runEventEnvelope:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        at_ms:
          examples:
          - 1
          format: uint64
          minimum: 0
          type: integer
        event_id:
          $ref: '#/components/schemas/EventId'
        kind:
          $ref: '#/components/schemas/EventKind'
        protocol_version:
          examples:
          - 1
          format: uint32
          minimum: 0
          type: integer
        seq:
          examples:
          - 1
          format: uint64
          minimum: 0
          type: integer
        turn_id:
          $ref: '#/components/schemas/TurnId'
      required:
      - seq
      - event_id
      - turn_id
      - at_ms
      - protocol_version
      - kind
      title: RecordedEvent
      type: object
  securitySchemes:
    bearer:
      in: header
      name: Authorization
      type: httpApiKey
info:
  contact:
    name: AnyBot 開發團隊
  description: 伺服器推給執行端與畫面的執行事件，走 SSE；內容 schema 由 Rust 型別產生。
  license:
    name: MIT OR Apache-2.0
    url: https://opensource.org/license/mit/
  title: AnyBot 執行事件協定
  version: '1'
operations:
  streamRunEvents:
    action: receive
    channel:
      $ref: '#/channels/runEvents'
    description: 客戶端從伺服器接收事件串流
    messages:
    - $ref: '#/components/messages/approval_card'
    - $ref: '#/components/messages/evidence_added'
    - $ref: '#/components/messages/run_error'
    - $ref: '#/components/messages/task_status_changed'
    - $ref: '#/components/messages/tool_call_result'
    - $ref: '#/components/messages/tool_call_started'
    - $ref: '#/components/messages/turn_ended'
    - $ref: '#/components/messages/turn_started'
    - $ref: '#/components/messages/turn_text'
    - $ref: '#/components/messages/turn_thinking'
    operationId: stream_run_events
    security:
    - description: M3 佔位；Bearer 金鑰。
      in: header
      name: Authorization
      type: httpApiKey
    tags:
    - description: 執行事件協定的事件種類
      name: events
    title: 接收事件串流
