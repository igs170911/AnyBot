asyncapi: 3.0.0
channels:
  runEvents:
    address: /v1/tasks/{taskId}/events/stream
    description: events pushed per task; each carries an increasing sequence number
    messages:
      approval_card:
        $ref: '#/components/messages/approval_card'
      evidence_added:
        $ref: '#/components/messages/evidence_added'
      run_error:
        $ref: '#/components/messages/run_error'
      task_status_changed:
        $ref: '#/components/messages/task_status_changed'
      tool_call_result:
        $ref: '#/components/messages/tool_call_result'
      tool_call_started:
        $ref: '#/components/messages/tool_call_started'
      turn_ended:
        $ref: '#/components/messages/turn_ended'
      turn_started:
        $ref: '#/components/messages/turn_started'
      turn_text:
        $ref: '#/components/messages/turn_text'
      turn_thinking:
        $ref: '#/components/messages/turn_thinking'
components:
  messages:
    approval_card:
      name: approval_card
      payload:
        properties:
          data:
            properties:
              card_id:
                $ref: '#/components/schemas/CardId'
              options:
                items:
                  type: string
                type: array
              summary:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - card_id
            - summary
            - options
            type: object
          kind:
            const: approval_card
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: event kinds of the run event protocol
      title: approval_card
    evidence_added:
      name: evidence_added
      payload:
        properties:
          data:
            properties:
              blob_id:
                $ref: '#/components/schemas/BlobId'
              evidence_id:
                $ref: '#/components/schemas/EvidenceId'
              summary:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - evidence_id
            - summary
            - blob_id
            type: object
          kind:
            const: evidence_added
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: event kinds of the run event protocol
      title: evidence_added
    run_error:
      name: run_error
      payload:
        properties:
          data:
            properties:
              code:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
              params:
                additionalProperties: true
                type: object
            required:
            - code
            type: object
          kind:
            const: run_error
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: event kinds of the run event protocol
      title: run_error
    task_status_changed:
      name: task_status_changed
      payload:
        properties:
          data:
            properties:
              detail:
                anyOf:
                - $ref: '#/components/schemas/TaskDetail'
                - type: 'null'
              status:
                $ref: '#/components/schemas/TaskStatus'
              task_id:
                $ref: '#/components/schemas/TaskId'
            required:
            - task_id
            - status
            type: object
          kind:
            const: task_status_changed
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: event kinds of the run event protocol
      title: task_status_changed
    tool_call_result:
      name: tool_call_result
      payload:
        properties:
          data:
            properties:
              call_id:
                $ref: '#/components/schemas/CallId'
              ok:
                examples:
                - true
                type: boolean
              output: true
            required:
            - call_id
            - ok
            - output
            type: object
          kind:
            const: tool_call_result
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: event kinds of the run event protocol
      title: tool_call_result
    tool_call_started:
      name: tool_call_started
      payload:
        properties:
          data:
            properties:
              args: true
              call_id:
                $ref: '#/components/schemas/CallId'
              name:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - call_id
            - name
            - args
            type: object
          kind:
            const: tool_call_started
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: event kinds of the run event protocol
      title: tool_call_started
    turn_ended:
      name: turn_ended
      payload:
        properties:
          data:
            type: object
          kind:
            const: turn_ended
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: event kinds of the run event protocol
      title: turn_ended
    turn_started:
      name: turn_started
      payload:
        properties:
          data:
            type: object
          kind:
            const: turn_started
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: event kinds of the run event protocol
      title: turn_started
    turn_text:
      name: turn_text
      payload:
        properties:
          data:
            properties:
              text:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - text
            type: object
          kind:
            const: turn_text
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: event kinds of the run event protocol
      title: turn_text
    turn_thinking:
      name: turn_thinking
      payload:
        properties:
          data:
            properties:
              text:
                examples:
                - 2026-01-01T00:00:00Z
                type: string
            required:
            - text
            type: object
          kind:
            const: turn_thinking
            examples:
            - 2026-01-01T00:00:00Z
            type: string
        required:
        - kind
        - data
        type: object
      summary: event kinds of the run event protocol
      title: turn_thinking
  schemas:
    BlobId:
      format: uuid
      type: string
    BudgetItem:
      enum:
      - tool_calls
      - turns
      - elapsed
      - tokens
      - cost
      - retries
      type: string
    CallId:
      format: uuid
      type: string
    CardId:
      format: uuid
      type: string
    EventId:
      format: uuid
      type: string
    EventKind:
      anyOf:
      - $ref: '#/components/schemas/KnownEventKind'
      - $ref: '#/components/schemas/RawEventKind'
    EvidenceId:
      format: uuid
      type: string
    KnownEventKind:
      oneOf:
      - properties:
          data:
            type: object
          kind:
            const: turn_started
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              text:
                type: string
            required:
            - text
            type: object
          kind:
            const: turn_text
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              text:
                type: string
            required:
            - text
            type: object
          kind:
            const: turn_thinking
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            type: object
          kind:
            const: turn_ended
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              args: true
              call_id:
                $ref: '#/components/schemas/CallId'
              name:
                type: string
            required:
            - call_id
            - name
            - args
            type: object
          kind:
            const: tool_call_started
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              call_id:
                $ref: '#/components/schemas/CallId'
              ok:
                type: boolean
              output: true
            required:
            - call_id
            - ok
            - output
            type: object
          kind:
            const: tool_call_result
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              card_id:
                $ref: '#/components/schemas/CardId'
              options:
                items:
                  type: string
                type: array
              summary:
                type: string
            required:
            - card_id
            - summary
            - options
            type: object
          kind:
            const: approval_card
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              blob_id:
                $ref: '#/components/schemas/BlobId'
              evidence_id:
                $ref: '#/components/schemas/EvidenceId'
              summary:
                type: string
            required:
            - evidence_id
            - summary
            - blob_id
            type: object
          kind:
            const: evidence_added
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              detail:
                anyOf:
                - $ref: '#/components/schemas/TaskDetail'
                - type: 'null'
              status:
                $ref: '#/components/schemas/TaskStatus'
              task_id:
                $ref: '#/components/schemas/TaskId'
            required:
            - task_id
            - status
            type: object
          kind:
            const: task_status_changed
            type: string
        required:
        - kind
        - data
        type: object
      - properties:
          data:
            properties:
              code:
                type: string
              params:
                additionalProperties: true
                type: object
            required:
            - code
            type: object
          kind:
            const: run_error
            type: string
        required:
        - kind
        - data
        type: object
    RawEventKind:
      properties:
        data: true
        kind:
          type: string
      required:
      - kind
      - data
      type: object
    TaskDetail:
      oneOf:
      - properties:
          detail:
            const: current_step
            type: string
          params:
            properties:
              step:
                type: string
            required:
            - step
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: queued
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: follow_up
            type: string
          params:
            properties:
              next_at:
                format: uint64
                minimum: 0
                type: integer
              number:
                format: uint32
                minimum: 0
                type: integer
            required:
            - number
            - next_at
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: verifying
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: planning
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: plan_progress
            type: string
          params:
            properties:
              step:
                format: uint32
                minimum: 0
                type: integer
              total:
                format: uint32
                minimum: 0
                type: integer
            required:
            - step
            - total
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: auto_resuming
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: approval_pending
            type: string
          params:
            properties:
              action:
                type: string
            required:
            - action
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: question_pending
            type: string
          params:
            properties:
              question:
                type: string
            required:
            - question
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: plan_approval_pending
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: confirmation_pending
            type: string
          params:
            properties:
              step:
                type: string
            required:
            - step
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: timed_out
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: resume_pending
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: computer_offline
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: goal_paused
            type: string
          params:
            properties:
              reason:
                type: string
            required:
            - reason
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: acceptance_decision_pending
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: no_activity
            type: string
          params:
            properties:
              minutes:
                format: uint32
                minimum: 0
                type: integer
            required:
            - minutes
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: over_budget
            type: string
          params:
            properties:
              item:
                $ref: '#/components/schemas/BudgetItem'
              limit:
                format: uint64
                minimum: 0
                type: integer
              used:
                format: uint64
                minimum: 0
                type: integer
            required:
            - item
            - used
            - limit
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: goal_stuck
            type: string
          params:
            properties:
              reason:
                type: string
            required:
            - reason
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: plan_stale
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: replied
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: accepted
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: delivered
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: user_confirmed
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: acceptance_failed
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: unverified_actions
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: step_rejected
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: no_visible_result
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: error
            type: string
          params:
            properties:
              reason:
                type: string
            required:
            - reason
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: goal_impossible
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: model_unreachable
            type: string
        required:
        - detail
        type: object
      - properties:
          detail:
            const: sent_target
            type: string
          params:
            properties:
              sent:
                format: uint32
                minimum: 0
                type: integer
              total:
                format: uint32
                minimum: 0
                type: integer
            required:
            - sent
            - total
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: cancelled_reason
            type: string
          params:
            properties:
              reason:
                type: string
            required:
            - reason
            type: object
        required:
        - detail
        - params
        type: object
      - properties:
          detail:
            const: you_stopped
            type: string
        required:
        - detail
        type: object
    TaskId:
      format: uuid
      type: string
    TaskStatus:
      enum:
      - running
      - awaiting_user
      - stuck
      - completed
      - unaccepted
      - failed
      - cancelled
      - stopped
      type: string
    TurnId:
      format: uuid
      type: string
    runEventEnvelope:
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        at_ms:
          examples:
          - 1
          format: uint64
          minimum: 0
          type: integer
        event_id:
          $ref: '#/components/schemas/EventId'
        kind:
          $ref: '#/components/schemas/EventKind'
        protocol_version:
          examples:
          - 1
          format: uint32
          minimum: 0
          type: integer
        seq:
          examples:
          - 1
          format: uint64
          minimum: 0
          type: integer
        turn_id:
          $ref: '#/components/schemas/TurnId'
      required:
      - seq
      - event_id
      - turn_id
      - at_ms
      - protocol_version
      - kind
      title: RecordedEvent
      type: object
  securitySchemes:
    bearer:
      in: header
      name: Authorization
      type: httpApiKey
info:
  contact:
    name: AnyBot dev team
  description: Server-pushed run events for runners and the UI, over SSE; the content schema is generated from Rust types.
  license:
    name: MIT OR Apache-2.0
    url: https://opensource.org/license/mit/
  title: AnyBot Run Event Protocol
  version: '1'
operations:
  streamRunEvents:
    action: receive
    channel:
      $ref: '#/channels/runEvents'
    description: the client receives the event stream from the server
    messages:
    - $ref: '#/channels/runEvents/messages/approval_card'
    - $ref: '#/channels/runEvents/messages/evidence_added'
    - $ref: '#/channels/runEvents/messages/run_error'
    - $ref: '#/channels/runEvents/messages/task_status_changed'
    - $ref: '#/channels/runEvents/messages/tool_call_result'
    - $ref: '#/channels/runEvents/messages/tool_call_started'
    - $ref: '#/channels/runEvents/messages/turn_ended'
    - $ref: '#/channels/runEvents/messages/turn_started'
    - $ref: '#/channels/runEvents/messages/turn_text'
    - $ref: '#/channels/runEvents/messages/turn_thinking'
    security:
    - description: M3 placeholder; bearer key.
      in: header
      name: Authorization
      type: httpApiKey
    tags:
    - description: event kinds of the run event protocol
      name: events
    title: receive the event stream
