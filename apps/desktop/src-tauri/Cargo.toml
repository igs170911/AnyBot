[package]
publish = false
name = "anybot-app-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "desktop shell (Tauri 2): the window is only a view, apps/agent does the work (spec/06 section 2.4, spec/07 section 3)"

[[bin]]
name = "anybot-desktop"
path = "src/main.rs"

[dependencies]
anybot-app-desktop-context = { path = "../context", version = "0.1.0" }
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }




[lints]
workspace = true
