name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the baseline compare needs the merge base, so fetch the full history.
          fetch-depth: 0
      # the toolchain version is pinned by rust-toolchain.toml; install only the components and tools the gates need here.
      - run: rustup component add rustfmt clippy
      - run: cargo install --locked cargo-deny cargo-machete cargo-nextest
      # the two official release tools the gates need (spec/05 section 1: gitleaks, oasdiff).
      - run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin
          curl -sL https://github.com/oasdiff/oasdiff/releases/download/v1.39.0/oasdiff_1.39.0_linux_amd64.tar.gz | tar -xz -C /usr/local/bin
          gitleaks --version && oasdiff --version
      # TypeScript gates (M2 item 3): the pnpm workspace.
      - run: npm install -g pnpm
      # Playwright browsers for the M4 section B e2e gate (make e2e); WebKit needs system deps.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@anybot/e2e exec playwright install --with-deps chromium webkit
      # the Rust part of Tauri 2 (apps/desktop/src-tauri) needs system packages such as WebKitGTK on Linux
      # (spec/06 section 2.4: WebKitGTK on Linux needs extra testing).
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            build-essential \
            curl wget file \
            libssl-dev \
            gitleaks
      # the spec-trace baseline "may only shrink" compare: CI uses the merge base of the main branch
      # (the local make check compares against HEAD; see SPEC_TRACE_REF in the Makefile).
      - run: |
          git fetch origin main
          BASE=$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD)
          echo "SPEC_TRACE_REF=$BASE" >> "$GITHUB_ENV"
      - run: make check
