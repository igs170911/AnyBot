[package]
publish = false
name = "anybot-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AnyBot server crate skeleton (spec/07 section 2)"
[dependencies]
anybot-foundation = { workspace = true }
anybot-protocol = { workspace = true, features = ["schema"] }
anybot-domain = { workspace = true }
anybot-messages = { workspace = true }
anybot-store-server = { workspace = true }
anybot-blob = { workspace = true }
anybot-bus = { workspace = true }
anybot-channels = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true, features = ["socket2"] }
utoipa = { workspace = true }
socket2 = { workspace = true }
getrandom = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
http-body-util = { workspace = true }
argon2 = { workspace = true, features = ["password-hash", "getrandom"] }
sha2 = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
[lints]
workspace = true

[dev-dependencies]
test-harness = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "macros", "rt-multi-thread"] }
serde_json = { workspace = true }
http-body-util = { workspace = true }
