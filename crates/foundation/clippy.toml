# clippy 禁用清單（spec/07 §3「用 lint 禁用的寫法」）
# 准許的套件在自己的資料夾放一份一模一樣的 clippy.toml，只少它被准許的禁用項目
# （spec/09 K75；由 tools/iron-laws 核對，不寫在程式碼裡）。
msrv = "1.98"
too-many-lines-threshold = 60
cognitive-complexity-threshold = 15
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-methods = [
    { path = "std::env::var", reason = "讀環境變數任何地方都不准（spec/07 §3）；設定用命令列 --data-dir、--bootstrap" },
    { path = "std::env::var_os", reason = "同上（spec/07 §3）" },
    { path = "std::env::vars", reason = "同上（spec/07 §3）" },
    { path = "std::env::vars_os", reason = "同上（spec/07 §3）" },
    { path = "std::env::temp_dir", reason = "同上（spec/07 §3）；暫存檔一律放 repo 的 target/（AGENTS §一7）" },
    { path = "std::process::Command::new", reason = "執行外部程式只准 computers 與 tests/harness，而且要經過 trust 給的通行證（spec/05 §2、spec/09 K87）" },
    { path = "std::process::Command::output", reason = "同上" },
    { path = "std::process::Command::spawn", reason = "同上" },
    { path = "std::process::Command::status", reason = "同上" },
    { path = "tokio::process::Command::new", allow-invalid = true, reason = "同上（非同步版也要经过 trust 通行證；spec/05 §2）" },
    { path = "tokio::process::Command::output", allow-invalid = true, reason = "同上" },
    { path = "tokio::process::Command::spawn", allow-invalid = true, reason = "同上" },
    { path = "tokio::process::Command::status", allow-invalid = true, reason = "同上" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "執行外部程式只准 computers 與 tests/harness（spec/05 §2、spec/09 K87）" },
    { path = "reqwest::Client::new", reason = "發 HTTP 請求只准 models、mcp、sync、channels、computers、tests/harness（spec/07 §3、spec/09 K87）" },
    { path = "reqwest::Client::get", reason = "同上" },
    { path = "reqwest::Client::post", reason = "同上" },
    { path = "reqwest::Client::put", reason = "同上" },
    { path = "reqwest::Client::delete", reason = "同上" },
    { path = "reqwest::Client::head", reason = "同上" },
    { path = "reqwest::Client::request", reason = "同上" },
    { path = "reqwest::RequestBuilder::send", reason = "同上" },
    { path = "reqwest::get", reason = "同上（簡便函式也要擋）" },
    { path = "reqwest::blocking::Client::new", allow-invalid = true, reason = "同上（blocking 版也要擋）" },
    { path = "reqwest::blocking::Client::get", allow-invalid = true, reason = "同上" },
    { path = "std::fs::read", reason = "讀寫任意檔案只准 computers、blob、store-client、tests/harness；foundation 只准讀 --bootstrap 指定的那個啟動檔（spec/07 §3）" },
    { path = "std::fs::write", reason = "同上" },
    { path = "std::fs::remove_file", reason = "同上" },
    { path = "std::fs::rename", reason = "同上" },
    { path = "std::fs::create_dir_all", reason = "同上" },
    { path = "std::fs::copy", reason = "同上" },
    { path = "std::fs::create_dir", reason = "同上" },
    { path = "std::fs::remove_dir", reason = "同上" },
    { path = "std::fs::remove_dir_all", reason = "同上" },
    { path = "std::fs::read_dir", reason = "同上" },
    { path = "std::fs::set_permissions", reason = "同上（spec/07 §3；啟動檔權限要寫死 0600）" },
    { path = "std::fs::hard_link", reason = "同上" },
    { path = "std::fs::OpenOptions::new", reason = "同上" },
    { path = "std::fs::OpenOptions::open", reason = "同上" },
    { path = "tokio::fs::read", reason = "同上" },
    { path = "tokio::fs::read_to_string", reason = "同上" },
    { path = "tokio::fs::write", reason = "同上" },
    { path = "tokio::fs::remove_file", reason = "同上" },
    { path = "tokio::fs::rename", reason = "同上" },
    { path = "tokio::fs::create_dir", reason = "同上" },
    { path = "tokio::fs::create_dir_all", reason = "同上" },
    { path = "tokio::fs::remove_dir", reason = "同上" },
    { path = "tokio::fs::remove_dir_all", reason = "同上" },
    { path = "tokio::fs::read_dir", reason = "同上" },
    { path = "tokio::fs::metadata", reason = "同上" },
    { path = "tokio::fs::set_permissions", reason = "同上" },
    { path = "tokio::fs::hard_link", reason = "同上" },
    { path = "tokio::fs::copy", reason = "同上" },
    { path = "tokio::fs::file", allow-invalid = true, reason = "同上" },
]

disallowed-types = [
    { path = "std::process::Command", reason = "執行外部程式只准 computers 與 tests/harness（spec/07 §3）" },
    { path = "tokio::process::Command", allow-invalid = true, reason = "同上" },
    { path = "std::fs::OpenOptions", reason = "同上" },
    { path = "std::fs::DirBuilder", reason = "同上" },
    { path = "tokio::fs::File", reason = "同上" },
]
