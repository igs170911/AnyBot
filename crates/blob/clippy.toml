# clippy disallowed list (spec/07 §3 "banned spellings")
# A permitted package keeps an identical copy in its own folder, missing only
# the entries it is permitted to exempt (spec/09 K75; verified by tools/iron-laws).
msrv = "1.98"
too-many-lines-threshold = 60
cognitive-complexity-threshold = 15
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-methods = [
    # reading environment variables: banned everywhere (spec/07 §3; command-line arguments are allowed)
    { path = "std::env::var", reason = "reading environment variables is banned everywhere (spec/07 §3); settings come from --data-dir and --bootstrap" },
    { path = "std::env::var_os", reason = "same (spec/07 §3)" },
    { path = "std::env::vars", reason = "same (spec/07 §3)" },
    { path = "std::env::vars_os", reason = "same (spec/07 §3)" },
    { path = "std::env::home_dir", reason = "reading environment variables is banned everywhere (spec/07 §3); only foundation is exempt (K85 app data dir)" },
    { path = "std::env::temp_dir", reason = "same (spec/07 §3); scratch files always live in the repo target/ (AGENTS §1.7)" },
    # running external programs: only computers and tests/harness, and only with a trust passport
    { path = "std::process::Command::new", reason = "running external programs is allowed only in computers and tests/harness, and only with a trust passport (spec/05 §2, spec/09 K87)" },
    { path = "std::process::Command::output", reason = "same" },
    { path = "std::process::Command::spawn", reason = "same" },
    { path = "std::process::Command::status", reason = "same" },
    { path = "tokio::process::Command::new", allow-invalid = true, reason = "same (the async variant also needs a trust passport; spec/05 §2)" },
    { path = "tokio::process::Command::output", allow-invalid = true, reason = "same" },
    { path = "tokio::process::Command::spawn", allow-invalid = true, reason = "same" },
    { path = "tokio::process::Command::status", allow-invalid = true, reason = "same" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "running external programs is allowed only in computers and tests/harness (spec/05 §2, spec/09 K87)" },
    # sending HTTP requests: only models, mcp, sync, channels, computers, tests/harness
    { path = "reqwest::Client::new", reason = "sending HTTP requests is allowed only in models, mcp, sync, channels, computers, tests/harness (spec/07 §3, spec/09 K87)" },
    { path = "reqwest::Client::get", reason = "same" },
    { path = "reqwest::Client::post", reason = "same" },
    { path = "reqwest::Client::put", reason = "same" },
    { path = "reqwest::Client::delete", reason = "same" },
    { path = "reqwest::Client::head", reason = "same" },
    { path = "reqwest::Client::request", reason = "same" },
    { path = "reqwest::RequestBuilder::send", reason = "same" },
    { path = "reqwest::get", reason = "same (the convenience function is banned too)" },
    { path = "reqwest::blocking::Client::new", allow-invalid = true, reason = "same (the blocking variant is banned too)" },
    { path = "reqwest::blocking::Client::get", allow-invalid = true, reason = "same (the blocking variant is banned too)" },
    # reading and writing arbitrary files: only computers, blob, store-client, tests/harness
    { path = "tokio::fs::read", reason = "same" },
    { path = "tokio::fs::read_to_string", reason = "same" },
    { path = "tokio::fs::write", reason = "same" },
    { path = "tokio::fs::remove_file", reason = "same" },
    { path = "tokio::fs::rename", reason = "same" },
    { path = "tokio::fs::create_dir", reason = "same" },
    { path = "tokio::fs::create_dir_all", reason = "same" },
    { path = "tokio::fs::remove_dir", reason = "same" },
    { path = "tokio::fs::remove_dir_all", reason = "same" },
    { path = "tokio::fs::read_dir", reason = "same" },
    { path = "tokio::fs::metadata", reason = "same" },
    { path = "tokio::fs::set_permissions", reason = "same" },
    { path = "tokio::fs::hard_link", reason = "same" },
    { path = "tokio::fs::copy", reason = "same" },
    { path = "tokio::fs::file", allow-invalid = true, reason = "same" },
]

disallowed-types = [
    { path = "std::process::Command", reason = "running external programs is allowed only in computers and tests/harness (spec/07 §3)" },
    { path = "tokio::process::Command", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::File", reason = "same" },
]
