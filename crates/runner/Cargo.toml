[package]
publish = false
name = "anybot-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Turn runner: one turn per user message (spec/07 section 2)"

[lints]
workspace = true

[dependencies]
anybot-foundation = { workspace = true }
anybot-protocol = { workspace = true }
anybot-domain = { workspace = true }
anybot-models = { workspace = true }
anybot-context = { workspace = true }
anybot-messages = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
runner-test = { workspace = true }
test-harness = { workspace = true }
proptest = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
