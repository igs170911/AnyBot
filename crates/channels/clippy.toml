max-struct-bools = 5
max-fn-params-bools = 5

# clippy disallowed list (spec/07 §3 "banned spellings")
# A permitted package keeps an identical copy in its own folder, missing only
# the entries it is permitted to exempt (spec/09 K75; verified by tools/iron-laws).
msrv = "1.98"
too-many-lines-threshold = 60
cognitive-complexity-threshold = 15
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true

disallowed-methods = [
    # reading environment variables: banned everywhere (spec/07 §3; command-line arguments are allowed)
    { path = "std::env::var", reason = "reading environment variables is banned everywhere (spec/07 §3); settings come from --data-dir and --bootstrap" },
    { path = "std::env::var_os", reason = "same (spec/07 §3)" },
    { path = "std::env::vars", reason = "same (spec/07 §3)" },
    { path = "std::env::vars_os", reason = "same (spec/07 §3)" },
    { path = "std::env::home_dir", reason = "reading environment variables is banned everywhere (spec/07 §3); only foundation is exempt (K85 app data dir)" },
    { path = "std::env::temp_dir", reason = "same (spec/07 §3); scratch files always live in the repo target/ (AGENTS §1.7)" },
    # running external programs: only computers and tests/harness, and only with a trust passport
    { path = "std::process::Command::new", reason = "running external programs is allowed only in computers and tests/harness, and only with a trust passport (spec/05 §2, spec/09 K87)" },
    { path = "std::process::Command::output", reason = "same" },
    { path = "std::process::Command::spawn", reason = "same" },
    { path = "std::process::Command::status", reason = "same" },
    { path = "tokio::process::Command::new", allow-invalid = true, reason = "same (the async variant also needs a trust passport; spec/05 §2)" },
    { path = "tokio::process::Command::output", allow-invalid = true, reason = "same" },
    { path = "tokio::process::Command::spawn", allow-invalid = true, reason = "same" },
    { path = "tokio::process::Command::status", allow-invalid = true, reason = "same" },
    { path = "std::os::unix::process::CommandExt::exec", reason = "running external programs is allowed only in computers and tests/harness (spec/05 §2, spec/09 K87)" },
    # sending HTTP requests: only models, mcp, sync, channels, computers, tests/harness
    # reading and writing arbitrary files: only computers, blob, store-client, tests/harness
    { path = "std::fs::read", reason = "reading and writing arbitrary files is allowed only in computers, blob, store-client, tests/harness; foundation may read only the --bootstrap startup file (spec/07 §3)" },
    { path = "std::fs::read_to_string", reason = "same" },
    { path = "std::fs::write", reason = "same" },
    { path = "std::fs::remove_file", reason = "same" },
    { path = "std::fs::rename", reason = "same" },
    { path = "std::fs::create_dir_all", reason = "same" },
    { path = "std::fs::copy", reason = "same" },
    { path = "std::fs::create_dir", reason = "same" },
    { path = "std::fs::remove_dir", reason = "same" },
    { path = "std::fs::remove_dir_all", reason = "same" },
    { path = "std::fs::read_dir", reason = "same" },
    { path = "std::fs::set_permissions", reason = "same (spec/07 §3; the startup file must be pinned to 0600)" },
    { path = "std::fs::hard_link", reason = "same" },
    { path = "std::fs::OpenOptions::new", reason = "same" },
    { path = "std::fs::OpenOptions::open", reason = "same" },
    { path = "std::fs::File::open", reason = "same (the startup file is opened once and permissions are read from the open handle: spec/07 §3)" },
    { path = "tokio::fs::read", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::read_to_string", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::write", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::remove_file", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::rename", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::create_dir", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::create_dir_all", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::remove_dir", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::remove_dir_all", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::read_dir", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::metadata", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::set_permissions", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::hard_link", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::copy", allow-invalid = true, reason = "same" },
    { path = "tokio::fs::file", allow-invalid = true, reason = "same" },
    # clock and time: every time access goes through the foundation Clock (M4 A.2)
    { path = "std::time::SystemTime::now", reason = "time access goes through the foundation Clock; only SystemClock reads the wall clock (M4 A.2)" },
    { path = "std::time::Instant::now", reason = "same (M4 A.2); timing helpers live in the test harness" },
    { path = "std::thread::sleep", reason = "same (M4 A.2); waiting goes through the Clock" },
    { path = "tokio::time::sleep", allow-invalid = true, reason = "same (M4 A.2); foundation SystemClock and tests/harness are exempt" },
    { path = "tokio::time::sleep_until", allow-invalid = true, reason = "same (M4 A.2)" },
    { path = "tokio::time::timeout", allow-invalid = true, reason = "same (M4 A.2)" },
    { path = "tokio::time::interval", allow-invalid = true, reason = "same (M4 A.2)" },
    { path = "tokio::time::Instant::now", reason = "same (M4 A.2); only foundation SystemClock owns real deadlines" },
    { path = "time::OffsetDateTime::now_utc", reason = "same (M4 A.2); only foundation SystemClock reads the wall clock" },
    { path = "anybot_models::SendPermit::for_endpoint", allow-invalid = true, reason = "ask models only through Session; the policy is the bot policy given when the Session is built" },
]

disallowed-types = [
    { path = "std::process::Command", reason = "running external programs is allowed only in computers and tests/harness (spec/07 §3)" },
    { path = "tokio::process::Command", allow-invalid = true, reason = "same" },
    { path = "std::fs::File", reason = "reading and writing arbitrary files is allowed only in computers, blob, store-client, tests/harness (spec/07 §3)" },
    { path = "std::fs::OpenOptions", reason = "same" },
    { path = "std::fs::DirBuilder", reason = "same" },
    { path = "tokio::fs::File", allow-invalid = true, reason = "same" },
]
