extends:
  - recommended-strict
plugins:
  - ./web/api-lint/plugin.js
rules:
  security-defined: error
  rule/operation-tags-not-empty:
    subject:
      type: Operation
      property: tags
    assertions:
      defined: true
      minLength: 1
    message: every API must have tags and the tags must not be empty (spec/05 section 2).
    severity: error
oas3_1Rules:
  operation-operationId: error
  operation-operationId-unique: error
  operation-summary: error
  operation-description: error
  operation-tag-defined: error
  operation-singular-tag: error
  no-empty-servers: error
  info-license: error
  info-contact: error
  operation-4xx-response: error
  operation-4xx-problem-details-rfc7807: error
  scalar-property-missing-example: error
  anybot/idempotencyKeyRequired: error
  rule/operation-has-5xx:
    subject:
      type: Responses
    assertions:
      requireAny: ["500", "502", "503", "504"]
    where:
      - subject:
          type: Operation
        assertions:
          defined: true
    message: "every operation must have a 5xx response (spec/05 section 2: error responses need 5xx)."
    severity: error
  rule/problem-json-in-4xx-5xx:
    subject:
      type: MediaTypesMap
    assertions:
      required: ["application/problem+json"]
    where:
      - subject:
          type: Response
          matchParentKeys: "^[45]"
        assertions:
          defined: true
    message: 4xx and 5xx response content must use application/problem+json (spec/05 section 2).
    severity: error
  rule/media-content-example-required:
    subject:
      type: MediaType
    assertions:
      requireAny: ["example", "examples"]
    message: every request body and response body must have example or examples (spec/05 section 2).
    severity: error
